<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 语言揉碎精讲 · 52 个知识点</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#04060d;--txt:#e9edf8;--dim:#98a2bd;--dim2:#6b7692;--line:rgba(255,255,255,.09);--panel:rgba(255,255,255,.045);--acc:#5ad1e6}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.75 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.au{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.au i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.45}
.au i:nth-child(1){width:600px;height:600px;background:#0e6fa8;top:-220px;left:-160px;animation:a1 26s ease-in-out infinite alternate}
.au i:nth-child(2){width:520px;height:520px;background:#5c6bc0;bottom:-200px;right:-140px;animation:a2 32s ease-in-out infinite alternate}
.au i:nth-child(3){width:420px;height:420px;background:#0f9b8e;top:40%;left:45%;opacity:.28;animation:a3 22s ease-in-out infinite alternate}
@keyframes a1{to{transform:translate(150px,110px) scale(1.15)}}
@keyframes a2{to{transform:translate(-130px,-90px) scale(1.1)}}
@keyframes a3{to{transform:translate(-110px,70px) scale(1.2)}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:310px 1fr;height:100vh}
.side{background:rgba(8,12,24,.74);backdrop-filter:blur(24px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:13px;padding:19px 15px}
.bt{font-size:19px;font-weight:700;background:linear-gradient(120deg,#7be0f2,#9db4ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.bs{font-size:11.5px;color:var(--dim2);margin-top:2px}
.pw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pb{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ad1e6,#9db4ff);transition:width .5s}
.pt2{font-size:11px;color:var(--dim);margin-top:7px;display:flex;justify-content:space-between}
#q{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;color:var(--txt);font-size:13px;outline:none;transition:.25s}
#q:focus{border-color:rgba(90,209,230,.5);background:rgba(90,209,230,.06)}
#q::placeholder{color:var(--dim2)}
.nav{flex:1;overflow-y:auto;padding-right:4px}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.ch{margin-bottom:5px}
.chh{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;user-select:none;transition:.2s;font-size:13px}
.chh:hover{background:rgba(255,255,255,.05)}
.cdot{width:8px;height:8px;border-radius:99px;flex:none;box-shadow:0 0 8px currentColor}
.ct{flex:1;font-weight:600;color:#cfd6e8}
.cc{font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.cr{font-size:8px;color:var(--dim2);transition:transform .25s}
.ch.open .cr{transform:rotate(90deg)}
.pl{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.2,.7,.2,1)}
.ch.open .pl{max-height:1000px}
.pi{display:flex;align-items:center;gap:8px;padding:6px 9px 6px 26px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--dim);transition:.18s}
.pi:hover{background:rgba(255,255,255,.05);color:#dbe2f2}
.pi.cur{background:rgba(90,209,230,.13);color:#fff}
.pn{font-size:10px;font-variant-numeric:tabular-nums;opacity:.75;width:23px;flex:none}
.pt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd{width:12px;height:12px;flex:none;border-radius:99px;border:1px solid rgba(255,255,255,.2)}
.pi.done .pd{background:linear-gradient(135deg,#5ad1e6,#7ee8b0);border-color:transparent;box-shadow:0 0 6px rgba(126,232,176,.5)}
.pi.done .pt{color:var(--dim2)}
.main{overflow-y:auto}
.crb{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(4,6,13,.95),rgba(4,6,13,.6));backdrop-filter:blur(14px);padding:13px 32px 11px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:11px}
.cbi{font-size:11px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}
.star{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 13px;font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap}
.star:hover{border-color:rgba(255,238,88,.4)}
.star.on{background:linear-gradient(135deg,rgba(255,238,88,.2),rgba(126,232,176,.14));border-color:rgba(255,238,88,.5);color:#ffe98a}
#view{max-width:880px;margin:0 auto;padding:28px 32px 10px}
.kh{margin-bottom:24px}
.ktag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.6px;padding:4px 11px;border-radius:99px;border:1px solid}
.kt{font-size:29px;font-weight:700;line-height:1.3;margin:12px 0 14px;letter-spacing:.3px}
.kk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;padding:15px 18px;font-size:16.5px;line-height:1.8;color:#eef2fb}
.kk b{color:var(--acc)}
.sec{margin:25px 0}
.sh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.9px;color:var(--dim);margin-bottom:11px}
.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.bd{font-size:15px;line-height:1.9;color:#d6dcea}
.bd p{margin:9px 0}
code{background:rgba(90,209,230,.1);border:1px solid rgba(90,209,230,.18);border-radius:5px;padding:1.5px 6px;font:13px/1.5 "SF Mono",ui-monospace,Menlo,monospace;color:#8fe6f5}
.cd{background:rgba(4,8,18,.72);border:1px solid var(--line);border-radius:12px;padding:15px 17px;overflow-x:auto;font:12.5px/1.85 "SF Mono",ui-monospace,Menlo,monospace;color:#d9e0f0;margin:12px 0;white-space:pre}
.mm{background:linear-gradient(180deg,rgba(90,209,230,.055),rgba(90,209,230,.01));border-color:rgba(90,209,230,.22)}
.lg{font-size:13px;color:var(--dim);line-height:2;margin-top:-5px}
.tb{width:100%;border-collapse:collapse;margin:13px 0;font-size:13px;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.tb th,.tb td{padding:8px 13px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);color:#d6dcea;vertical-align:top;line-height:1.7}
.tb th{background:rgba(90,209,230,.09);color:#8fe6f5;font-weight:600;font-size:12px;letter-spacing:.5px}
.tb tr:last-child td{border-bottom:none}
.tb td:first-child{font-family:"SF Mono",ui-monospace,Menlo,monospace;color:#8fe6f5;font-size:12.5px;white-space:nowrap}
.tb .ok{color:#7ee8b0}
.tb .no{color:#ff9aa6}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
.wr{background:rgba(255,107,107,.055);border:1px solid rgba(255,107,107,.22);border-radius:12px;padding:14px 16px;margin:12px 0}
.wh{font-size:12.5px;font-weight:700;color:#ff9aa6;margin-bottom:8px}
.er{font:12px/1.7 "SF Mono",ui-monospace,monospace;color:#ff9aa6;background:rgba(0,0,0,.35);border-radius:8px;padding:8px 11px;margin:7px 0;white-space:pre-wrap;word-break:break-all}
.ww{font-size:13.5px;color:#d6c9cd;line-height:1.8;margin-top:8px}
.ti{display:flex;gap:10px;align-items:flex-start;background:rgba(255,238,88,.06);border:1px solid rgba(255,238,88,.2);border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.8;color:#f0e8c8}
.qz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.qq{font-size:14.5px;font-weight:600;color:#eef2fb;margin-bottom:13px}
.qo{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.18s;background:rgba(255,255,255,.02);font-size:14px}
.qo:hover{border-color:rgba(90,209,230,.4);background:rgba(90,209,230,.06)}
.qo .mk{width:20px;height:20px;border-radius:99px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:11px;flex:none}
.qo.ok{border-color:rgba(126,232,176,.6);background:rgba(126,232,176,.1)}
.qo.ok .mk{background:#7ee8b0;border-color:transparent;color:#06281a}
.qo.no{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.09)}
.qe{display:none;margin-top:13px;padding:12px 14px;background:rgba(90,209,230,.07);border:1px solid rgba(90,209,230,.2);border-radius:10px;font-size:13.5px;color:#cfe6ee;line-height:1.8}
.qz.ex .qe{display:block;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}}
.pv{position:sticky;bottom:0;max-width:880px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:13px 32px;background:linear-gradient(0deg,rgba(4,6,13,.96),rgba(4,6,13,.55));backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.06)}
.pv button{flex:1;padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13.5px;cursor:pointer;transition:.2s}
.pv button:hover:not(:disabled){border-color:rgba(90,209,230,.5);background:rgba(90,209,230,.1)}
.pv button:disabled{opacity:.3;cursor:not-allowed}
.pm{font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
#burger{display:none;position:fixed;top:12px;left:12px;z-index:30;width:38px;height:38px;border-radius:11px;background:rgba(8,12,24,.85);border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:16px;backdrop-filter:blur(12px)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:20;transform:translateX(-100%);transition:transform .3s}#burger{display:grid;place-items:center}.side.show{transform:none}#view{padding:28px 18px 10px}.crb,.pv{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div class="au"><i></i><i></i><i></i></div>
<button id="burger">☰</button>
<div class="app">
<aside class="side" id="side">
<div><div class="bt">C 语言揉碎精讲</div><div class="bs">10 章 · 52 个知识点 · 原理向拆解</div></div>
<div class="pw"><div class="pb"><i id="pf"></i></div><div class="pt2"><span id="pt">已掌握 0 / 0</span><span id="pv"></span></div></div>
<input id="q" placeholder="搜索：指针 / 越界 / 值传递 / 字节">
<div class="nav" id="nav"></div>
</aside>
<main class="main" id="main">
<div class="crb"><span class="ct" id="cch"></span><span class="cbi" id="cbi"></span><button class="star" id="star">☆ 标记已掌握</button></div>
<div id="view"></div>
<div class="pv"><button id="pv">← 上一个</button><span class="pm" id="pm"></span><button id="nx">下一个 →</button></div>
</main>
</div>
<script>
const DATA = [
{ no:'1', ch:'语言概述', color:'#4dd0e1', icon:'📖', points:[
{ t:'C 语言特点',
  key:'C 把硬件直接摊在你面前：<b>编译成机器码、内存自己管、可以用指针碰任意地址</b>。强大和危险是同一件事。',
  why:`<p><b>编译型</b>：源码直接变成机器码，运行时没有任何解释层，速度接近汇编。高级语言要么解释执行，要么自带虚拟机和垃圾回收，多了一层开销。</p>
<p><b>没有垃圾回收</b>：高级语言里你不用的对象会被 GC 自动收走；C 里堆内存是你 <code>malloc</code> 申请的，必须自己 <code>free</code>。忘写 free，这块内存就永远占着，程序越跑越吃内存。</p>
<p><b>有指针</b>：你可以直接算地址、直接读写任意内存单元。这是 C 能写操作系统内核的原因——内核要精确控制中断、驱动、内存页表，抽象层在关键路径上是多余的。代价是：指错地址不会提示，直接崩。</p>
<p><b>可移植</b>：ANSI C 只规定语义不规定实现，同一份代码换编译器（gcc / clang / MSVC）都能编。这就是"一次编写，到处编译"。</p>`,
  mem:`<pre class="cd mm">高级语言（Java / Python）的运行路径:

  源码 → 解释器/虚拟机 → 运行时(GC + 对象层) → CPU
              ↑ 每次执行都在解释，多一层开销

C 语言的运行路径:

  源码 → 编译 → 机器码 → CPU    ← 直接对话硬件</pre>
<div class="lg"><i style="background:#5ad1e6"></i>自由 = 责任：越界不报、忘记 free 就泄漏、指针指错就崩</div>`,
  wrong:[{t:'把 C 当高级语言用，觉得内存会自动回收',code:`int *p = malloc(100 * sizeof(int));
fill(p);          /* 用完了 */
/* 没写 free(p) → 这块内存永远占着 */`,err:'编译能过，运行也不报错 —— 但这是最阴险的一类 bug',w:'C 没有 GC。<code>malloc/free</code> 必须成对出现，不释放就是<b>内存泄漏</b>。这也是 C 面试最爱问"内存泄漏怎么产生的"。'}],
  tip:'<b>一句话记</b>：C 给你的是"权限"不是"安全"——它不拦你，也不替你收拾。',
  quiz:{q:'下列哪项不是 C 语言的特点？',o:['编译型语言，效率高','可以直接操作内存地址','有自动垃圾回收机制','贴近硬件，可移植性好'],a:2,ex:'C 需要手动 malloc/free 管理内存，没有 GC。这正是"强大和危险是同一件事"。'}
},
{ t:'第一个程序',
  key:'<code>main</code> 是操作系统交给你的入口，<code>return 0</code> 是你交出去的"我正常退出了"。',
  why:`<p><b>main 为什么是入口</b>：你双击可执行文件时，操作系统先跑一小段启动代码（crt0），它做完初始化后跳转到 <code>main</code> 的地址开始执行。所以 main 必须是 <code>int</code> 返回型——返回值给操作系统用。</p>
<p><b>return 0 是给操作系统的退出码</b>：0 = 正常，非 0 = 出错。shell 里 <code>./a &amp;&amp; echo OK</code> 能打印 OK，靠的就是退出码 0。这不是"给人看的打印"，是程序对 OS 的正式答复。</p>
<p><b>#include 为什么必须写</b>：<code>printf</code> 的真实定义在 libc 库里，<code>&lt;stdio.h&gt;</code> 只是把它的"长相"（返回 int、第一个参数是 const char*）声明给编译器。不写，编译器不知道 printf 存在，直接报错。头文件是<b>名片</b>，不是定义。</p>
<p><b>为什么要有 \\n</b>：stdout 默认是<b>行缓冲</b>——遇到换行符才把缓冲区真正刷到屏幕。没有 \\n，输出可能憋在缓冲区里，直到程序退出才出现。这是新手"我明明 printf 了为什么没输出"的第一大原因。</p>`,
  mem:`<pre class="cd mm">一个正在运行的 C 进程，内存长这样（地址从上往下变小）:

  -------------------------------  高地址
  | 命令行参数 / 环境变量
  | ------------------------------
  | 栈 stack   （局部变量 a、i 都在这里）
  |    v  向下增长
  |
  |      （空闲区，两边互相挤）
  |
  | 堆 heap   （malloc 从这里向上长）
  | ------------------------------
  | .bss   未初始化的全局变量
  | .data  已初始化（有初值）的全局变量
  | .text  你的代码编译后的机器码
  -------------------------------  低地址</pre>
<div class="lg"><i style="background:#4dd0e1"></i>局部变量在<b>栈</b>：函数进出自动收，你不操心
<i style="background:#ef5350"></i>malloc 在<b>堆</b>：你不 free 就永远占着</div>`,
  wrong:[{t:'用中文输入法打了分号',code:`int main(void) {
    printf("Hello, World!\\n")；   ← 中文全角分号
    return 0;
}`,err:"hello.c:2:28: error: expected ';' after expression\n      |  int main(void) {\n      |                             ^\n      |                             ;",w:'词法分析器只认识 ASCII 半角 <code>;</code>（1 字节）。中文 <code>；</code> 是 3 字节 UTF-8，被当成"未知标识符"，于是编译器以为语句还没写完。<b>写代码前先切英文输入法。</b>'}],
  tip:'<b>一句话记</b>：<code>#include</code> 是名片、<code>main</code> 是入口、<code>\\n</code> 是刷新开关、<code>;</code> 必须是英文。',
  quiz:{q:'main 函数末尾的 return 0; 表示什么？',o:['程序发生错误','程序正常结束，向操作系统交出退出码','返回了 0 条语句','进入死循环'],a:1,ex:'return 的值是给操作系统的退出码，0 约定为"正常"。shell 的 $? 读的就是它。'}
},
{ t:'编译运行流程',
  key:'四步各有分工：<b>预处理换文本，编译查语法，汇编翻译，链接解决"名字"</b>。分不清哪一步报错，调试就白忙一半。',
  why:`<p><b>预处理（-E）</b>：把 <code>#include</code> 的文件内容原样抄进来、把 <code>#define</code> 的文本替换掉、删掉注释，得到 .i 文件。这一步<b>不做任何语法检查</b>。</p>
<p><b>编译（-S）</b>：词法 → 语法 → 语义 → 优化 → 生成汇编 .s。<code>expected ';'</code> 在这一步报出来。</p>
<p><b>汇编（-c）</b>：汇编语句变成机器码，产出 .o 目标文件。此时函数调用还是"悬空"的——只有名字，没有地址。</p>
<p><b>链接</b>：把所有 .o 和库合并，把每个函数名填成真正的内存地址，得到可执行文件。缺定义在这一步报 <code>undefined reference</code>。</p>
<p><b>诊断价值</b>：<b>编译错误</b> = 语法/语义有问题（改代码）；<b>链接错误</b> = 名字找不到定义（补定义、加库文件）。看到 undefined reference 就知道语法没问题，别在语法上白费时间。</p>`,
  mem:`<pre class="cd mm">一步到位:   clang hello.c -o hello

分步看每步产物:

  hello.c  ── 预处理 -E ──> hello.i      头文件已抄进来、宏已替换
      |
      └── 编译   -S ──> hello.s         汇编代码
          |
          └── 汇编   -c ──> hello.o      机器码（函数调用还悬空）
              |
              └── 链接 ──> hello         可执行文件（地址全部填好）

  每一步都可能失败，报错信息能直接定位是哪一步</pre>
<div class="lg"><i style="background:#66bb6a"></i>预处理只换文本，编译只查语法，链接只解决"名字找不到"</div>`,
  wrong:[{t:'把链接错误当成编译错误，反复改语法',code:`int main(void) {
    foo();                 /* 根本没定义 foo */
    return 0;
}`,err:"ld: undefined reference to 'foo'\ncollect2: error: ld returned 1 exit status",w:'这是<b>链接错误</b>，不是编译错误——语法完全正确，只是"名字叫不上人"。补一个 foo 的定义，或者把定义所在的 .o 一起链进来。'}],
  tip:'<b>一句话记</b>：编译错找语法，链接错找定义。看到 undefined 就停手别改语法了。',
  quiz:{q:'把 .c 源文件变成可执行程序，正确的顺序是：',o:['编译 → 预处理 → 汇编 → 链接','预处理 → 编译 → 汇编 → 链接','汇编 → 编译 → 预处理 → 链接','链接 → 编译 → 预处理 → 汇编'],a:1,ex:'预处理(换文本) → 编译(查语法生成汇编) → 汇编(成机器码 .o) → 链接(填地址成可执行文件)。'}
},
{ t:'注释',
  key:'<b>注释在预处理第一步就被扔掉了</b>，编译器从头到尾看不见它——所以它不影响速度，只影响人能不能读懂。',
  why:`<p>预处理器的第一个动作就是 tokenize + 去注释。注释不参与编译、不占内存、不影响运行速度，它的唯一读者是人。</p>
<p><b>为什么不能嵌套</b>：预处理器没有深度计数器，看到<b>第一个</b> <code>*/</code> 就认为注释结束了，不管前面有几个 <code>/*</code>。剩下那个 <code>*/</code> 反而变成了代码，直接语法报错。</p>
<p><b>为什么 // 能存在</b>：C99 才纳入标准（C89 只认 <code>/* */</code>）。老编译器、部分嵌入式工程至今只用 <code>/* */</code>。</p>
<p><b>注释的正确价值</b>：写"为什么"，别写"做什么"。<code>i++; // 加 1</code> 是废话；<code>// 循环变量必须写在语句块开头，为了兼容老师给的模板</code> 才是有用的。</p>`,
  wrong:[{t:'注释里嵌套注释',code:`/* 外层注释
   /* 内层注释 */      ← 第一个 */ 就把外层结束了
   剩下的部分编译器当代码看
*/`,err:'error: expected identifier or \'{\'\n（报错位置通常很迷惑，会指到下一行）',w:'记住：<b>注释没有嵌套概念</b>。要临时禁用一段代码，宁可加个前缀或者整块删掉。'}],
  tip:'<b>一句话记</b>：注释是给人看的，编译器第一步就把它删了；<code>/* */</code> 不嵌套，<code>//</code> 要 C99。',
  quiz:{q:'关于 C 语言注释，正确的是：',o:['注释参与编译，影响运行速度','注释可以任意嵌套','编译器忽略注释内容','// 注释在 C89 标准中就已存在'],a:2,ex:'注释被编译器完全忽略；<code>/* */</code> 不能嵌套；单行 <code>//</code> 是 C99 才纳入标准的。'}
}]
},
{ no:'2', ch:'数据类型', color:'#42a5f5', icon:'📦', points:[
{ t:'基本数据类型',
  key:'类型不是标签，是<b>给一串 0/1 套上的"解读规则"</b>。内存里只有比特，没有"整数"也没有"小数"。',
  why:`<p>内存里只有 0 和 1。<code>int a;</code> 的真实含义是：分配 4 字节，并约定这 4 字节按"补码整数"解读。换成 <code>float</code>，同一块内存就按 IEEE 754 浮点解读——**数值完全不同**。</p>
<p>这就是第 8 章 union 能"偷看"一个 int 的字节顺序的原理：底层比特没变，变的只是你用来读它的规则。</p>
<p><b>char 为什么恒为 1 字节</b>：C 标准唯一硬性规定 <code>sizeof(char) == 1</code>，它是所有其他类型大小的度量单位。所以说 int 是 4 字节，等于"4 个 char"。</p>
<p><b>int 通常 4 字节</b>：范围 -2147483648 ~ 2147483647（约 ±21 亿），超过就溢出，值会"绕回来"。存大数要用 <code>long long</code>。</p>
<p><b>float 4 字节 / double 8 字节</b>：精度由 IEEE 754 的尾数位数决定，float 约 6~7 位有效数字，double 约 15~16 位。写 <code>2.5f</code> 加个 f 是告诉编译器这是 float 而不是 double。</p>
<p><b>大小端</b>：数字 <code>0x41424344</code> 存进内存时，第一个字节是 0x41 还是 0x44 取决于平台。你这块 Apple Silicon 是<b>小端</b>（低位在前），所以读出来是 0x44。</p>`,
  mem:`<table class="tb">
<tr><th>类型</th><th>字节</th><th>解读规则</th><th>能装什么</th></tr>
<tr><td>char</td><td>1</td><td>ASCII 码 / 小整数</td><td>'A' 或 65</td></tr>
<tr><td>short</td><td>2</td><td>补码整数</td><td>±3.2 万</td></tr>
<tr><td>int</td><td>4</td><td>补码整数</td><td>±21 亿</td></tr>
<tr><td>float</td><td>4</td><td>IEEE 754 浮点</td><td>约 6~7 位有效数字</td></tr>
<tr><td>double</td><td>8</td><td>IEEE 754 浮点</td><td>约 15~16 位有效数字</td></tr>
<tr><td>unsigned int</td><td>4</td><td>无符号整数</td><td>0 ~ 42.9 亿</td></tr>
</table>
<div class="lg"><i style="background:#42a5f5"></i>同一串比特换规则就是另一个数 —— 这是 union 能"偷看内存"的根本原因</div>`,
  wrong:[{t:'用 %d 打印 double，得到一串乱数',code:`double pi = 3.14159265;
printf("%d\\n", pi);      /* 格式符和参数类型对不上 */`,err:'输出: 0        （或一个奇怪的数，不报错）',w:'printf 看到 <code>%d</code> 就从变参表里按"4 字节整数"取数，但实际放的是 8 字节的 double → <b>取错宽度</b>。编译不报错，因为 printf 是变参函数，类型检查帮不上你。'}],
  tip:'<b>一句话记</b>：类型 = 解读规则。char 永远是 1 字节，int 是 ±21 亿，float 只保 6~7 位有效数字。',
  quiz:{q:'char 类型通常占多少字节？',o:['1 字节','2 字节','4 字节','8 字节'],a:0,ex:'sizeof(char) 恒为 1，这是 C 标准唯一硬性规定的类型大小，也是度量其他类型的单位。'}
},
{ t:'变量与初始化',
  key:'<b>变量名只在编译期存在</b>，运行时你手里只有地址。名字是给人和编译器看的便利，不是数据本身。',
  why:`<p><b>编译期</b>：编译器把变量名记在符号表里，最后生成一段"名字 → 地址"的映射表（写在可执行文件的调试信息里，lldb 打印 <code>print a</code> 时靠它显示变量名）。编译完成后这个映射就固化成"偏移量 + 寻址模式"。</p>
<p><b>运行期</b>：CPU 完全不知道你的变量叫 a，它只会算地址、读写内存。所以"变量"这个概念其实只存在于人脑和编译器的符号表里。</p>
<p><b>为什么未初始化是"垃圾值"</b>：栈上那块内存之前放过别的数据（上一个函数留下的局部变量），没人清过。这不是"随机数"，是<b>残留数据</b>，属于未定义行为——不同编译器、不同优化级别结果可能完全不一样。</p>
<p><b>命名规则</b>：C89 只保证 ASCII 字符集，所以变量名只能是字母、数字、下划线，且不能以数字开头。所以 <code>2name</code>、<code>my-name</code>、<code>int</code> 都非法。</p>`,
  mem:`<pre class="cd mm">编译期：符号表里有"名字 → 地址"

  符号表                      运行期内存
  ─────────                   ─────────
  a        → 0x...8            [ 42 ]
  b        → 0x...C            [ 20 ]
  sum      → 0x...10           [ 0  ]

  CPU 不认识 a，它只会说"去 0x...8 读 4 字节"
  lldb 的 print a 之所以能显示名字，就是反查这张表</pre>
<div class="lg"><i style="background:#42a5f5"></i>去掉 -g 编译，可执行文件里连这张表都没有，断点也只能看地址</div>`,
  wrong:[{t:'定义后不初始化就使用',code:`int x;                 /* 只分配，没赋初值 */
printf("%d\\n", x);     /* 读残留数据 */`,err:'输出: 16777216      （每次都可能不同，属于未定义行为）',w:'栈内存之前放过别的东西，没人清过。这是<b>未定义行为</b>，标准里根本没规定结果——有的编译器能直接把它优化掉，你的"计算"被整个删掉都不会报警。'}],
  tip:'<b>一句话记</b>：变量名是标签，地址才是本体。定义就顺手初始化，别读垃圾值。',
  quiz:{q:'下列哪个是合法的变量名？',o:['2name','int','_count','my-name'],a:2,ex:'不能以数字开头、不能用关键字 int、不能含连字符；下划线开头合法。'}
},
{ t:'常量',
  key:'<b>#define 是编译前的文本替换，const 是编译后一段不可写的内存</b>。两者机制完全不同。',
  why:`<p><code>#define PI 3.14</code>：预处理器把源码里每个 <code>PI</code> 字符替换成 <code>3.14</code>。<b>不占内存、没有类型、不做类型检查</b>。</p>
<p><code>const double PI = 3.14</code>：占 8 字节内存、有类型、编译器会检查类型。试图给它赋值会编译报错。</p>
<p><b>为什么宏末尾写分号会炸</b>：宏是纯文本替换，分号也被原样带进去。于是 <code>PI * r</code> 展开成 <code>3.14; * r</code>——分号提前截断语句，编译直接报错。</p>
<p><b>怎么选</b>：纯数值常数、宏开关、需要拼成标识符时用 <code>#define</code>（0 运行时开销）；需要类型检查、当函数参数传递、要参与调试时用 <code>const</code>。</p>`,
  mem:`<pre class="cd mm">两种"常量"的机制对比

  #define PI 3.14          → 预处理期文本替换
  源码:  double a = PI;
  展开:  double a = 3.14;   不占内存、无类型、无检查

  const double PI = 3.14;  → 编译期变量
  内存:  [ 8 字节，标记为只读 ]
         有类型、有检查、调试器能看见它</pre>
<div class="lg"><i style="background:#42a5f5"></i>宏是"换字"，const 是"锁内存"——报错时机和位置都不同</div>`,
  wrong:[{t:'宏定义末尾多写了一个分号',code:`#define PI 3.14;      /* 分号被当成了宏内容的一部分 */
double a = PI * 3;    /* 展开成 3.14; * 3  */`,err:"error: expected identifier or '(' after 'double'\n      |  double a = PI * 3;\n      |                ^",w:'宏展开是<b>纯文本替换</b>，分号也被原样带进去，于是 <code>3.14;</code> 提前结束了语句，<code>* 3</code> 变成了悬空的表达式。经典陷阱，报错位置还会指到下一行。'}],
  tip:'<b>一句话记</b>：宏是预处理期换文本（别带分号），const 是运行期锁内存。',
  quiz:{q:'#define N 10 的含义是：',o:['定义了变量 N 等于 10','预处理时把 N 文本替换为 10','定义了常量指针','声明了一个函数'],a:1,ex:'#define 是宏定义，预处理器做纯文本替换。N 根本不占内存，也不是变量。'}
},
{ t:'printf 格式化输出',
  key:'<b>printf 拿着格式串当"取货单"</b>，按顺序从可变参数表里取数——类型不匹配，它照取不误，只是取错。',
  why:`<p><code>printf</code> 是<b>可变参数函数</b>：第一个参数固定，后面有多少个、各是什么类型，编译器<b>不检查</b>，全靠你自己对准。</p>
<p>变参通过 <code>va_list</code> / <code>va_arg</code> 从内存里取。格式符 <code>%d</code> 意思是"取 4 字节当整数"，但如果你传的是 8 字节的 double，它就按错的宽度取 → 得到乱码，甚至读到下一段内存。</p>
<p><b>%f 默认 6 位小数</b>：浮点数在二进制里多数是小尾数（0.1 就是无限循环），打印太多位是没意义的数字，所以默认砍到 6 位。<code>%.2f</code> 手动指定。</p>
<p><b>%% 是转义</b>：格式串里遇到 <code>%%</code>，输出一个字面量 <code>%</code>。这是唯一能在格式串里打印百分号的方法。</p>
<p><b>\\n 是刷新开关</b>：stdout 是行缓冲，没有换行符输出可能憋在缓冲区里不刷屏（见第 1 章）。</p>`,
  mem:`<pre class="cd mm">printf 内部其实在做这件事:

  printf("name=%s score=%d\\n", "Sir", 95);

  格式串解析:  name=  → %s(取一个 char*，按字符串读) → ' score=' → %d(取 4 字节当整数) → '\\n'
                  ↑ 顺次从变参表取                      ↑
                  取出 "Sir"                           取出 95

  取货单和货物必须一一一对上，错一位后面全错</pre>
<div class="lg"><i style="background:#42a5f5"></i>编译器不检查变参类型——这个坑只能你自己避开</div>`,
  wrong:[{t:'用 %d 打印 double',code:`double x = 3.14159;
printf("%d\\n", x);      /* 格式符是 %d，参数是 double */`,err:'输出: 0       （编译不报错，运行时取错宽度）',w:'printf 看到 %d 就按 4 字节整数取数，而 double 占 8 字节 → 取到的只是它的一半。这也是为什么浮点输出必须用 <code>%f</code>（或 <code>%.2f</code>）。'}],
  tip:'<b>一句话记</b>：<code>%d</code> 整数、<code>%f</code> 浮点、<code>%c</code> 字符、<code>%s</code> 字符串；<code>%%</code> 打百分号；<code>%.2f</code> 控小数位。',
  quiz:{q:'printf("%d%%", 50); 的输出是：',o:['%d% 50','50%','50 %%','50'],a:1,ex:'%% 输出一个百分号本身，所以整体输出 50%。'}
},
{ t:'scanf 格式化输入',
  key:'<b>scanf 是"往内存里写数据的人"，值传递只给它副本，所以它必须拿到你的内存地址。</b>',
  why:`<p>C 只有<b>值传递</b>：调用 <code>f(x)</code> 时，x 拿到的是实参的<b>副本</b>。scanf 想真正把读到的数据写进你的变量，就必须知道"写到哪里"——所以它要的是<b>地址</b>，你用 <code>&amp;</code> 取地址符给它。</p>
<p><b>double 用 %lf 而不是 %f</b>：C 标准规定 <code>scanf</code> 里 <code>%f</code> 对应 <code>float*</code>、<code>%lf</code> 对应 <code>double*</code>。注意这和 printf 相反（printf 里 %f 对 float 和 double 都生效），是历史遗留，别记混。</p>
<p><b>为什么格式串里别写 \\n</b>：scanf 格式串中的空白字符（空格、\\t、\\n）含义是"跳过任意多个空白，并等待下一个非空白输入"。写 <code>scanf("%d\\n",&amp;a)</code> 会导致它一直等你再输入，程序看起来像"卡住了"。</p>
<p><b>返回值得利用</b>：scanf 返回成功读到的项数。<code>while (scanf("%d",&amp;n)==1 &amp;&amp; n!=-1)</code> 既处理了输入结束，又处理了 EOF。</p>`,
  mem:`<pre class="cd mm">scanf 为什么一定要 &amp;

  假设有 int age = ?

  栈内存                scanf 内部
  ─────────              ─────────
  [ age ]  地址 0x...10
      ↑
      │  scanf 需要的是"写到哪里"，不是"现在是什么值"
      ↓
  scanf("%d", &age)  →  读到 20  →  往 0x...10 写 20

  如果只传 age（值传递）: scanf 只拿到 ? 的副本，
  改副本 = 改空气，外面的 age 纹丝不动</pre>
<div class="lg"><i style="background:#42a5f5"></i>&amp; = 把"门牌号"给它；值传递 = 只给了"抄本"</div>`,
  wrong:[{t:'忘写取地址符 &',code:`int a;
scanf("%d", a);      /* 传的是 a 的值（垃圾值），不是地址 */`,err:'Segmentation fault（段错误）/ 程序直接崩',w:'a 的垃圾值被当成"要写入的地址"，scanf 往一个非法地址写数据 → 越权访问，操作系统直接杀进程。这是新手第一崩溃。'}],
  tip:'<b>一句话记</b>：scanf 要地址所以加 &amp;；double 用 %lf；格式串里不要 \\n。',
  quiz:{q:'int x; 要正确读入 x，应写：',o:['scanf("%d", x);','scanf("%d", &x);','scanf("%lf", &x);','scanf(&x, "%d");'],a:1,ex:'scanf 需要变量的地址，普通变量前必须加 &amp; 取地址；double 才用 %lf。'}
},
{ t:'类型转换',
  key:'<b>混合运算 C 自动"就高不就低"</b>；整数除法<b>先截断</b>，事后再转 double 就是白转。',
  why:`<p><b>整型提升</b>：char / short 参与运算时会自动先提升为 int，避免 8 位溢出。所以 <code>'A' + 1</code> 得到的是 int 66。</p>
<p><b>5 / 2 = 2 的原因</b>：两边都是 int，C 标准规定整数除法<b>向零截断</b>，结果类型还是 int。小数在"除法那一步"就被丢掉了，根本没机会变成小数。</p>
<p><b>括号位置决定一切</b>：<code>(double)(a/b)</code> 先整除得 2 再转 2.0；<code>(double)a/b</code> 先把 a 转成 2.0 再除得 2.5。两个括号，一个结果。</p>
<p><b>(int) 是截断不是四舍五入</b>：向零取整。<code>(int)3.99 = 3</code>，<code>(int)-3.99 = -3</code>。二进制视角：3.99 在 double 里小数位全都在，(int) 直接把小数部分整段丢掉，只保留整数位。</p>
<p><b>浮点比大小要当心</b>：<code>0.1 + 0.2 == 0.3</code> 是假的（二进制浮点表示不精确），工程上通常比 <code>fabs(a-b) &lt; 1e-6</code>。</p>`,
  mem:`<pre class="cd mm">同一个运算，两种括号，两个结果

  int a = 5, b = 2;

  写法 A:  (double)(a / b)
    第 1 步  a / b     →  5 / 2 = 2        ← 整数除法，小数当场丢弃
    第 2 步  转 double  →  2.0
    结果: 2.0   ❌ 转晚了

  写法 B:  (double)a / b
    第 1 步  转 double  →  a 变成 5.0
    第 2 步  浮点除法   →  5.0 / 2 = 2.5
    结果: 2.5   ✅ 先转再除</pre>
<div class="lg"><i style="background:#42a5f5"></i>运算从左到右，遇到类型不同的先"就高不就低"，转换永远只发生在"运算之前"</div>`,
  wrong:[{t:'先除再转，小数永远回不来',code:`int a = 5, b = 2;
printf("%f\\n", (double)(a / b));   /* 期望 2.5，得到 2.0 */`,err:'输出: 2.000000',w:'整数除法在小数产生之前就把它丢掉了。想拿到小数，必须让<b>除法发生之前</b>至少有一边变成浮点：<code>(double)a / b</code>。'}],
  tip:'<b>一句话记</b>：整数除整数还是整数；想要小数，先把<b>其中一个</b>转成 double。',
  quiz:{q:'表达式 (int)7.9 + 7 / 2 的值是：',o:['10','9','9.9','7'],a:0,ex:'(int)7.9 截断得 7；7/2 整数除法得 3；7+3 = 10。两个考点：截断不四舍五入、整数相除仍是整数。'}
},
{ t:'sizeof 运算符',
  key:'<b>sizeof 是编译期常量，不是运行时调用</b>；数组一旦退化成指针，它就算错了。',
  why:`<p>sizeof 是<b>运算符</b>不是函数：编译期就用类型系统的布局信息直接算出大小，<b>不生成任何机器指令</b>。所以它能用在"必须是编译期常量"的地方（比如数组长度）。</p>
<p>返回值类型是 <code>size_t</code>（无符号长整型），严格来说该用 <code>%zu</code> 打印。考试里用 <code>%d</code> 通常也能过，但要注意溢出。</p>
<p><b>为什么数组作参数后 sizeof 失效</b>：C 的数组作函数参数时会<b>退化为指针</b>（传的是首地址）。函数里 <code>sizeof(a)</code> 算的是<b>指针大小 8</b>，不是数组总大小。所以 <code>sizeof(a)/sizeof(a[0])</code> 这个技巧只在数组"本体"处成立。</p>
<p><b>sizeof(char) == 1</b> 是唯一被 C 标准写死的（见本章开头）。</p>`,
  mem:`<pre class="cd mm">sizeof 在两个位置，算出来的东西完全不同

  在 main 里（a 是数组本体）:

    int a[5];                  sizeof(a)   = 5 × 4 = 20  ← 整个数组
                               sizeof(a[0]) = 4
                               元素个数     = 20 / 4 = 5   ✅

  在函数里（a 退化成了指针）:

    void f(int a[]) {         sizeof(a)   = 8            ← 只是指针！
      printf("%zu\\n", sizeof(a));
    }
    此时 sizeof(a)/sizeof(a[0]) = 8/4 = 2   ❌ 完全错</pre>
<div class="lg"><i style="background:#42a5f5"></i>数组传参就是首地址。想知道长度，把长度作为额外参数传进去</div>`,
  wrong:[{t:'在函数里用 sizeof 求数组元素个数',code:`void print(int a[]) {
    for (int i = 0; i < sizeof(a)/sizeof(a[0]); i++)
      printf("%d\\n", a[i]);   /* 只打印前 2 个 */
}`,err:'传入 5 个元素，只打印了 2 个',w:'函数参数里的 <code>a</code> 已经退化成指针，<code>sizeof(a)</code> = 8（指针大小）。这个技巧只在数组定义处有效，函数里要用长度参数。'}],
  tip:'<b>一句话记</b>：sizeof 是编译期常量；数组本体处可用，进函数就废了。',
  quiz:{q:'sizeof(double) 的结果是：',o:['4','8','16','取决于编译器一定是 4'],a:1,ex:'主流平台 double 为 8 字节（float 是 4）。只有 sizeof(char) 是标准硬性规定的。'}
}]
},
{ no:'3', ch:'运算符', color:'#7e57c2', icon:'🧮', points:[
{ t:'算术运算符',
  key:'两个整数相除<b>结果还是整数</b>；<code>%</code> 只能用于整数，结果符号跟<b>被除数</b>。',
  why:`<p><b>/ 除法</b>：两边都是整数时，C 标准规定<b>向零截断</b>（C99 起）。想拿小数，先让其中一边变成浮点（见第 2 章 2.6）。</p>
<p><b>% 取余</b>：C 标准规定两个操作数<b>都必须是整数</b>。<b>除数不能为 0</b>——整数除零不是"返回错误码"，而是触发硬件信号，操作系统直接把进程杀掉。</p>
<p><b>结果符号跟被除数</b>：<code>-7 % 3 = -1</code>。C99 起规定截断除法，余数符号与被除数一致（老标准未定义）。</p>
<p><b>拆数位</b>：<code>n % 10</code> 取个位，<code>n / 10 % 10</code> 取十位，以此类推。这是期末和等级考试最经典的题型。</p>
<p><b>恒等关系</b>：<code>q = a / b; r = a % b;</code> 恒有 <code>a = q * b + r</code>，且 <code>0 &le; |r| &lt; |b|</code>。理解这条，拆位、循环、校验位都能推出来。</p>`,
  mem:`<pre class="cd mm">拆一个数：n = 12345

  n % 10           = 5        ← 个位
  n / 10 % 10      = 4        ← 十位
  n / 100 % 10     = 3        ← 百位
  n / 1000 % 10    = 2        ← 千位
  n / 10000 % 10   = 1        ← 万位

  规律：先用"除以 10 的 k 次方"把目标位移到个位，再用 % 10 取它</pre>
<div class="lg"><i style="background:#7e57c2"></i>除法和取余是一对搭档：q*b + r 永远等于 a</div>`,
  wrong:[{t:'想用 % 求小数部分',code:`printf("%f\\n", 5.5 % 2);    /* 期望 1.5 */`,err:"error: invalid operands to binary % (have 'double' and 'int')",w:'<code>%</code> 的操作数必须是整数。想取小数部分，用 <code>x - (int)x</code>。'}],
  tip:'<b>一句话记</b>：整除取整、余数跟被除数走；拆数位就是"先除再模"。',
  quiz:{q:'printf("%d", 5 / 2); 的输出是：',o:['2.5','2','3','编译错误'],a:1,ex:'两个整数相除结果仍是整数，向零截断得 2（不是四舍五入）。'}
},
{ t:'关系与逻辑运算符',
  key:'关系运算产生<b>真 1 / 假 0</b>；<code>&amp;&amp;</code> / <code>||</code> 有<b>短路</b>——能定结果就不算后半段。',
  why:`<p><b>真假规则</b>：C 里没有"布尔"这个词，<code>0</code> 为假，<b>任何非 0 都是真</b>。所以 <code>if (3)</code> 是成立的，<code>!0</code> 等于 1。</p>
<p><b>优先级阶梯</b>：关系运算符（<code>&gt; &lt; &gt;= &lt;=</code>）&gt; <code>==</code> <code>!=</code> &gt; <code>&amp;&amp;</code> &gt; <code>||</code> &gt; 赋值。记不住就加括号，这是最稳的写法。</p>
<p><b>短路求值</b>：<code>a &amp;&amp; b</code> 中 a 为假时 b <b>根本不计算</b>；<code>a || b</code> 中 a 为真时 b 不计算。这是 C 标准明确保证的行为。</p>
<p><b>短路的真正价值</b>：不是省性能，是<b>避免非法操作和副作用</b>。<code>if (p != NULL &amp;&amp; *p == 1)</code>——如果把顺序反过来，空指针解引用当场崩溃。</p>
<p><b>= vs ==</b>：<code>if (a = 5)</code> 是赋值，表达式值为 5（非 0 = 真），if 永远成立，而且 a 被悄悄改了。编译器通常只给警告。</p>`,
  mem:`<pre class="cd mm">短路怎么判断"后半段有没有被算"——用自增当探针

  int a = 0, i = 0;

  ( a > 3 ) && ( i++ );
     假            不计算   →  i 仍是 0   （&& 前半假，后半跳过）

  ( a > 3 ) || ( i++ );
     假            必须算   →  i 变成 1   （|| 前半假，后半要判断）

  同一句代码，换成 || 结果就不同 → 这就是短路的证据</pre>
<div class="lg"><i style="background:#7e57c2"></i>判断相等永远是 == ，单等号是赋值——新手第一高发 bug</div>`,
  wrong:[{t:'if 里把 == 写成 =',code:`if (a = 5) {            /* 想比较，写成了赋值 */
    printf("相等\\n");    /* 这一行永远会执行 */
}`,err:"warning: suggest parentheses around assignment used as truth value",w:'<code>a = 5</code> 是赋值，表达式值为 5（非 0 = 真）→ if 永远成立，而且 a 被悄悄改成 5。编译器一般只警告不报错，<b>警告不是噪音，要看</b>。'}],
  tip:'<b>一句话记</b>：0 假非 0 真；&amp;&amp; 假就短路、|| 真就短路；相等用双等号。',
  quiz:{q:'int x=1; if(x = 0) printf("A"); else printf("B"); 输出：',o:['A','B','报错','随机'],a:1,ex:'x = 0 是赋值，表达式值为 0（假）→ 走 else 输出 B，且 x 被改成 0。'}
},
{ t:'自增自减',
  key:'<code>i++</code> 先用后加，<code>++i</code> 先加后用。同一个表达式里对同一变量多次自增是<b>未定义行为</b>。',
  why:`<p><code>i++</code> 的语义是"取出 i 的<b>当前值</b>参与运算，之后 i 变成 i+1"；<code>++i</code> 是"先把 i 变成 i+1，再取值"。两者最终 i 都加 1，差别只在<b>表达式用的是新值还是旧值</b>。</p>
<p>只作用于<b>变量</b>（左值）：<code>(a+b)++</code> 非法，因为 a+b 不是一个可写的变量。</p>
<p><b>陷阱</b>：<code>i++ + ++i</code> 是<b>未定义行为</b>。C 标准只要求"两次修改之间必须存在一次序列点"，而这里没有 → 不同编译器结果不同（有的 7、有的 8）。考试选"未定义"，实际代码拆开写。</p>
<p>考试经典：<code>j = i++;</code> 之后 j 是旧值、i 是新值；<code>j = ++i;</code> 之后两个都是新值。</p>`,
  mem:`<pre class="cd mm">i = 3, j = ?

  j = i++;     后置：先把旧值 3 交给 j，再让 i 加 1
               →  j = 3,   i = 4

  j = ++i;     前置：先把 i 加 1 变成 4，再把新值交给 j
               →  j = 4,   i = 4</pre>
<div class="lg"><i style="background:#7e57c2"></i>口诀：后缀 i++ 是"旧值"，前缀 ++i 是"新值"</div>`,
  wrong:[{t:'一个表达式里对同一变量自增两次',code:`int i = 3;
printf("%d\\n", i++ + ++i);    /* 未定义行为 */`,err:'不同编译器给出不同结果（有的 7，有的 8，多数还会警告）',w:'C 标准没有规定它的求值顺序 → 未定义行为。考试里答"未定义"，工程里拆成两行写。'}],
  tip:'<b>一句话记</b>：后缀用旧值，前缀用新值；一个表达式别自增两次。',
  quiz:{q:'int i=3; printf("%d", i++); 之后 i 的值是：',o:['输出 3，i 变 4','输出 4，i 变 4','输出 3，i 保持 3','输出 4，i 变 3'],a:0,ex:'后置 ++ 先把旧值 3 打印，然后 i 自增为 4。'}
},
{ t:'赋值与复合赋值',
  key:'赋值<b>从右向左</b>结合，所以 <code>a = b = c = 5</code> 能写；复合赋值左边必须是变量。',
  why:`<p><b>赋值是右结合的</b>：<code>a = b = c = 5</code> 先算 <code>c = 5</code>，再 <code>b = (c=5)</code>，再 <code>a = (b=...)</code>，三个都变 5。</p>
<p>原因是<b>赋值表达式本身也有值</b>（就是被赋进去的那个值），所以能嵌在别的表达式里、能继续赋值给左边的变量。</p>
<p><b>复合赋值</b>：<code>a += b</code> 等价 <code>a = a + b</code>。左边必须是变量（可写），所以 <code>10 += 5</code> 非法。</p>
<p>注意 <code>a *= b + 3</code> 等价 <code>a = a * (b + 3)</code>——右边整个表达式先算完再乘，不是 <code>(a*b) + 3</code>。</p>
<p>赋值优先级几乎最低：<code>int x = a + 1 = 2;</code> 是错的，必须加括号。</p>`,
  mem:`<pre class="cd mm">a = b = c = 5  实际怎么算

  第 1 步   c = 5        c 变 5，表达式值 5
  第 2 步   b = 5        b 变 5，表达式值 5
  第 3 步   a = 5        a 变 5

  关键：赋值右结合 + 赋值表达式本身有值 → 所以能连写</pre>
<div class="lg"><i style="background:#7e57c2"></i>考试高频：a += a -= a*a 这类"连坐"题必须手推</div>`,
  wrong:[{t:'连坐运算的顺序（期末经典陷阱）',code:`int a = 6;
a += a -= a * a;     /* 从右向左算 */
printf("%d\\n", a);   /* 输出 -60 */`,err:'很多同学手算成 36 或 0，正确答案是 -60',w:'赋值右结合：<b>先算右边</b> <code>a -= 36</code> → a = 6-36 = -30；<b>再算左边</b> <code>a += -30</code> → a = -30 + (-30) = -60。务必逐步骤手推。'}],
  tip:'<b>一句话记</b>：赋值右结合；连坐题永远"从右往左、一步一步"推。',
  quiz:{q:'int a=6; a += a -= a * a; 执行后 a = ?',o:['0','-60','36','12'],a:1,ex:'从右向左：先 a -= 36 → a = -30；再 a += -30 → a = -60。'}
},
{ t:'位运算符',
  key:'直接操作二进制位。<code>&lt;&lt; 1</code> 相当于乘 2；位运算优先级<b>低于</b> <code>==</code>，混用必须加括号。',
  why:`<p><code>&amp;</code> 按位与：两位都是 1 才为 1 → 用于<b>清零、取某一位</b>。</p>
<p><code>|</code> 按位或：有 1 则为 1 → 用于<b>置位</b>。</p>
<p><code>^</code> 异或：不同为 1 → 用于<b>不用临时变量交换两个值</b>、简易加密。</p>
<p><code>~</code> 取反：0 变 1、1 变 0。</p>
<p><code>&lt;&lt;</code> 左移：<code>n &lt;&lt; 1</code> 相当于 n×2；<code>&gt;&gt;</code> 右移相当于 n÷2（负数右移左边补 1，是算术移位）。</p>
<p><b>优先级坑</b>：<code>&amp; | ^</code> 的优先级<b>低于</b> <code>== !=</code>。所以 <code>if (a &amp; 1 == 0)</code> 实际算的是 <code>a &amp; (1 == 0)</code> → 恒为 0 → 判断永远失败。</p>`,
  mem:`<pre class="cd mm">a = 12 (1100)      b = 10 (1010)

       1100                1100                1100
     &amp; 1010            | 1010            ^ 1010
     ------            ------            ------
       1000 = 8          1110 = 14         0110 =  6

  按位与：两位都 1 才留 1      按位或：有 1 就是 1       异或：不同才是 1

  移位：  a &lt;&lt; 1 = 24  （×2）      a &gt;&gt; 2 = 3  （÷4）</pre>
<div class="lg"><i style="background:#7e57c2"></i>嵌入式里判断奇偶、权限掩码、寄存器操作全靠位运算</div>`,
  wrong:[{t:'位运算和比较运算符混用不加括号',code:`int a = 4;
if (a & 1 == 0) printf("偶数");    /* 想判断 a 是否为偶数 */`,err:'编译不报错，也不崩溃——但永远判断不出来',w:'<code>==</code> 优先级高于 <code>&amp;</code>，实际算的是 <code>a &amp; (1 == 0)</code> = <code>a &amp; 0</code> = 0（假）。必须写成 <code>(a & 1) == 0</code>。这类 bug 编译器不报、运行也不崩，最阴。'}],
  tip:'<b>一句话记</b>：左移乘 2、右移除 2；位运算优先级低，跟 == 一起用必须加括号。',
  quiz:{q:'表达式 6 &lt;&lt; 1 的值是：',o:['3','12','6','5'],a:1,ex:'左移一位相当于乘 2：6 &lt;&lt; 1 = 12。反之 6 &gt;&gt; 1 = 3。'}
},
{ t:'优先级与三目运算符',
  key:'运算符有<b>优先级和结合性</b>；三目 <code>?:</code> 是"一行 if-else"，<b>只选值、不赋值</b>。',
  why:`<p><b>优先级是"谁先算"</b>：<code>3 + 4 &gt; 5</code> 实际是 <code>(3+4) &gt; 5</code>，因为算术高于关系。搞清楚这个，才不会写出和"预期不一样"的代码。</p>
<p><b>四个大方向（从上到下）</b>：① 算术 <code>* / %</code>、<code>+ -</code>；② 关系 <code>&gt; &lt; &gt;= &lt;=</code>；③ 逻辑 <code>! &amp;&amp; ||</code>；④ 赋值 <code>=</code>（几乎最低）。</p>
<p><b>最容易记错的 5 个</b>：* 高于 +；关系高于逻辑；<code>&amp;&amp;</code> 高于 <code>||</code>；赋值最低；<code>++ -- ! ~</code> 是一元运算符，优先级最高。</p>
<p><b>结合性</b>：多数运算符<b>从左到右</b>结合，但<b>赋值是右到左</b>——所以 <code>a = b = 3;</code> 合法，<code>a += b += 1;</code> 也合法。</p>
<p><b>三目运算符 ?:</b>：条件 ? 真值 : 假值，是 C 里唯一的三元运算符。等价于一行 if-else，<b>可以嵌在表达式里</b>，这是它比 if 好用的地方。</p>
<p><b>三目的两个坑</b>：① 它只<b>选值不赋值</b>——<code>max = a &gt; b ? a : b;</code> 里的 <code>=</code> 必须放在 ? 外面；② 结合性是<b>右到左</b>，嵌套三目必须加括号，否则解析顺序跟你想的不一样。</p>
<p><b>什么时候用三目</b>：赋值语句里（<code>x = a &gt; b ? a : b;</code>）很自然。但条件越复杂越难读，超过一行就老实写 if-else。</p>`,
  mem:`<pre class="cd mm">优先级金字塔（越靠上越先算）

  第 1 层  一元:   ++  --  !  ~  &amp;  *            右到左
  第 2 层  乘除:   *   /   %                      左到右
  第 3 层  加减:   +   -                          左到右
  第 4 层  关系:   &gt;   &lt;   &gt;=  &lt;=                  左到右
  第 5 层  相等:   ==  !=                          左到右
  第 6 层  逻辑与: &amp;&amp;                              左到右（短路）
  第 7 层  逻辑或: ||                              左到右（短路）
  第 8 层  三目:   ?:                              右到左
  第 9 层  赋值:   =  +=  -=  *=  /=  %=           右到左

  实际判断:
    3 + 4 * 2    →  3 + 8     =  11
    3 + 4 &gt; 5    →  (3+4) &gt; 5  =  7 &gt; 5  =  1
    a = b = 3    →  先 b=3，再 a=3     （赋值右结合）

  三目运算符:
    int max = a &gt; b ? a : b;
    等价于:
      int max;
      if (a &gt; b) max = a; else max = b;

    两个关键:
      ① 只"选值"不"赋值"，= 必须写在 ?: 外面
      ② 右到左结合，嵌套时加括号:
        a &gt; b ? a : (b &gt; c ? b : c);</pre>
<div class="lg"><i style="background:#66bb6a"></i>记住"算术 → 关系 → 逻辑 → 赋值"这个顺序，就能避开九成优先级坑</div>`,
  wrong:[{t:'三目运算符里的赋值位置写反',code:`int max;
max = a > b ? a : b;          /* ✅ 正确：= 在 ?: 外面 */
a > b ? max = a : max = b;    /* ❌ 能跑但极难读 */`,err:'编译能过，但可读性极差，维护时容易改错',w:'三目运算符是<b>表达式</b>，结果是"值"。想让"选择"和"赋值"一起发生，把 <code>=</code> 放在 ?: <b>外面</b>：max = a &gt; b ? a : b;'}],
  tip:'<b>一句话记</b>：算术 &gt; 关系 &gt; 逻辑 &gt; 赋值；赋值右结合所以能连写；三目只选值不赋值。',
  quiz:{q:'表达式 3 + 4 &gt; 5 的值是：',o:['4','1','0','7'],a:1,ex:'算术优先级高于关系，先算 3+4=7，再算 7&gt;5 得 1（真）。若误认为 3+(4&gt;5) 就会算错。'}
}]
},
{ no:'4', ch:'控制流程', color:'#66bb6a', icon:'🔀', points:[
{ t:'if / else if / else',
  key:'分支内多条语句<b>必须加大括号</b>；else 总是跟它前面<b>最近的、未配对的</b> if 配对，跟缩进无关。',
  why:`<p><b>判断的真假</b>：if 里放任何表达式，非 0 即真。所以 <code>if (a)</code> 合法，<code>if (3 &amp;&amp; b)</code> 也合法。</p>
<p><b>大括号是边界</b>：没有大括号时，if 只管<b>紧跟的第一条</b>语句。这是新手最常踩的坑。</p>
<p><b>悬空 else（dangling else）</b>：C 语法规定 else 与<b>最近的、未配对的</b> if 配对，跟你怎么缩进<b>完全无关</b>。所以嵌套 if 一定要加大括号说清楚。</p>
<p><b>if 链</b>：多个 else if 从上到下依次判断，命中一个就跳出整个链。建议把最可能命中的条件放前面。</p>
<p><b>别这样写</b>：<code>if (a == b == c)</code> 实际是 <code>(a == b) == c</code>，先把 a==b 变成 0/1 再去和 c 比。要写 <code>a == b &amp;&amp; b == c</code>。</p>`,
  mem:`<pre class="cd mm">悬空 else：编译器按"最近的未配对 if"配对，跟缩进无关

  if (a > 3)               ← 外层 if，它自己没有 else
      if (a > 10)          ← 内层 if
          printf("X");
      else                 ← 配的是内层！不是外层！
          printf("Y");

  当 a = 5：外层成立、内层不成立 → 走 else 输出 Y

  想配外层，必须加大括号：
    if (a > 3) {
        if (a > 10) printf("X");
    } else {
        printf("Y");
    }</pre>
<div class="lg"><i style="background:#66bb6a"></i>缩进只是给人看的，语法只看大括号和"最近未配对"</div>`,
  wrong:[{t:'if 不加括号，只控制了第一句',code:`if (score >= 60)
    printf("及格\\n");
    printf("可以继续学\\n");     /* 这句永远执行！ */`,err:'不及格的学生也会看到"可以继续学"',w:'没有大括号时 if 只管紧跟的<b>第一条</b>语句。养成习惯：只要有多条语句就加大括号——即使只有一条也加，以后再改不会出错。'}],
  tip:'<b>一句话记</b>：多语句必加括号；else 配最近的 if；缩进骗不了编译器。',
  quiz:{q:'int a=5; if(a>3) if(a>10) printf("X"); else printf("Y"); 输出：',o:['X','Y','XY','什么都不输出'],a:1,ex:'else 配最近的 if(a>10)：a=5 满足外层、不满足内层 → 走 else 输出 Y。'}
},
{ t:'switch / case',
  key:'每个 case 记得 <b>break</b>，否则会"穿透"继续往下执行；表达式只能是<b>整型或字符型</b>。',
  why:`<p><b>三个限制</b>：① 表达式只能是<b>整型或字符型</b>（不能是 double）；② case 后面必须是<b>常量</b>（不能是变量）；③ 同一个 switch 里 case 值不能重复。</p>
<p><b>穿透（fall-through）</b>：忘了 break，就会从匹配的 case 开始<b>一路往下执行</b>，直到碰到 break 或 switch 结束。方向和书写顺序一致，不是倒序。</p>
<p>有时候穿透是<b>故意的</b>：多个 case 输出同一个结果时，把 break 放在最后那个 case 后面，能省很多代码（比如 case 6 / case 7 都输出"周末"）。</p>
<p><b>性能与可读性</b>：case 少的用 if 链更直观；case 多且连续时编译器会生成跳转表，比一串 else if 更快。</p>
<p>switch 只能跳<b>进</b>不能跳<b>出</b>；想退出得用 break，或者把 switch 包在循环里再在外面 break。</p>`,
  mem:`<pre class="cd mm">穿透方向：从"匹配到的 case"开始，顺着代码往下掉

  switch(2) {
      case 2:  printf("二\\n");    ← 匹配这里，开始执行
      case 1:  printf("一\\n");    ← 没 break，掉进这里继续
  }
  输出：二  一        ← 顺序跟书写顺序一致，不是倒序

  故意利用穿透合并输出：
    case 6: printf("周末\\n");     ← 没有 break
    case 7: printf("休息\\n");
            break;                 ← break 放在最后
  输入 6 输出"周末休息"，输入 7 也是"休息"</pre>
<div class="lg"><i style="background:#66bb6a"></i>考试爱考穿透顺序：从匹配点往书写方向走，别想成倒序</div>`,
  wrong:[{t:'忘了写 break',code:`int day = 3;
switch (day) {
    case 3: printf("周三\\n");     /* 没写 break */
    case 4: printf("周四\\n");
    default: printf("无效\\n");
}`,err:'输出：周三 周四 无效',w:'没 break 就一路往下掉。有的是 bug，有的是<b>故意合并</b>（case 6/7 都输出"周末"）。写的时候要在心里过一遍"会不会掉下去"。'}],
  tip:'<b>一句话记</b>：case 只能是常量整型；每个 case 想清楚要不要 break。',
  quiz:{q:'switch 中 case 2 后面没有 break，往下还有 case 1 输出"一"，匹配 case 2 输出"二"，结果是：',o:['只输出 二','输出 二一','输出 一二','报错'],a:1,ex:'匹配 case 2 输出"二"后没有 break，穿透到 case 1 输出"一"。顺序跟书写方向一致。'}
},
{ t:'while 循环',
  key:'先<b>判断</b>后执行的当型循环；循环体必须让条件<b>趋向为假</b>，否则死循环。',
  why:`<p><b>执行顺序</b>：判断条件 → 为真则执行循环体 → 回到判断 → 为假则退出。</p>
<p><b>最少执行 0 次</b>：条件一开始就为假，循环体一次都不执行。这是它和 do-while 的<b>唯一</b>区别。</p>
<p><b>三要素</b>：初始化、条件、更新，缺一不可。忘更新 = 死循环。</p>
<p><b>死循环的两个来源</b>：① 循环体里忘了更新条件变量；② 条件写成了赋值 <code>while (i = 1)</code>，赋值表达式值为 1 恒真。</p>
<p>适合<b>次数不确定</b>的场景：读文件到末尾、输入 -1 停止。<code>while (scanf("%d",&amp;n) == 1 &amp;&amp; n != -1)</code> 这种写法既处理输入失败又处理结束条件。</p>`,
  mem:`<pre class="cd mm">while 的执行顺序（判断在循环体"之前"）

        ┌────────────┐
        │ 初始化 i=1  │
        └─────┬──────┘
              ↓
        ┌─────────────┐   假
        │  i &lt;= 100 ? ───────────→ 退出，打印 sum
        └─────┬───────┘
             真 ↓
      ┌───────────────┐
      │   sum += i    │
      │    i++        │  ← 忘了这行 = 死循环
      └───────┬───────┘
              │
              └──── 回到判断</pre>
<div class="lg"><i style="background:#66bb6a"></i>条件一开始就假 → 一次都不执行（do-while 会执行一次）</div>`,
  wrong:[{t:'忘了写更新语句',code:`int i = 1, sum = 0;
while (i &lt;= 100) {
    sum += i;
    /* 忘了 i++ */
}`,err:'程序卡死（CPU 跑到 100%），只能 Ctrl+C',w:'条件永远为真，循环体无限重复。三要素少一个都不行——尤其是"更新"。'}],
  tip:'<b>一句话记</b>：先判断后执行，可能一次都不跑；三要素必须齐全。',
  quiz:{q:'while 循环的最少执行次数是：',o:['0 次','1 次','2 次','无限次'],a:0,ex:'while 先判断条件，一开始就为假则一次都不执行。至少执行一次的是 do-while。'}
},
{ t:'do-while 循环',
  key:'先执行<b>再</b>判断，循环体<b>至少执行一次</b>；结尾的分号不能少。',
  why:`<p><b>执行顺序</b>：执行循环体 → 判断条件 → 为真则重复，为假则退出。</p>
<p><b>与 while 的唯一区别</b>就是"至少执行一次"。考试常给初值不满足条件：<code>int i = 10; while (i &lt; 5)</code> 一次都不跑，<code>do { ... } while (i &lt; 5)</code> 跑一次。</p>
<p><b>结尾分号</b>：<code>do { } while ();</code> 整条是一个完整语句，<code>while (条件)</code> 后面必须有分号。漏了是语法错误。</p>
<p>适合<b>先操作再问要不要继续</b>的场景：菜单程序、输入循环、"至少做一次"的业务（先输出欢迎语）。</p>`,
  mem:`<pre class="cd mm">用"一开始就不满足"的条件对比 while 和 do-while

  int i = 10;

  while (i &lt; 5)  { printf("A"); i++; }
  →  先判断 i&lt;5 为假 → 一次都不执行，什么都不打印

  do { printf("B"); i++; } while (i &lt; 5);
  →  先打印 B，再判断 i&lt;5 为假 → 结束

  输出差异：while 0 次，do-while 1 次   ← 考试高频对比题</pre>
<div class="lg"><i style="background:#66bb6a"></i>唯一区别：循环体至少执行一次</div>`,
  wrong:[{t:'结尾漏了分号',code:`do {
    printf("%d\\n", i++);
} while (i &lt; 5)         /* 少一个分号 */`,err:"error: expected ';' after 'while' condition",w:'<code>do { } while ();</code> 整条是一条完整语句，结尾必须加分号。这是新手最常见的语法错之一。'}],
  tip:'<b>一句话记</b>：先跑再看；至少一次；末尾分号不能丢。',
  quiz:{q:'int i=0; do { i++; } while(i<0); 循环体执行几次？',o:['0 次','1 次','无限次','2 次'],a:1,ex:'do-while 先执行一次（i 变 1），再判断 i<0 为假结束，共执行 1 次。'}
},
{ t:'for 循环',
  key:'三要素写在一行，<b>最适合次数已知</b>的场景；两个分号不能省，<code>for(;;)</code> 就是死循环。',
  why:`<p><b>执行顺序</b>：初始化 → 判断条件 → 循环体 → 更新 → 再判断 → ……（注意<b>更新在循环体之后</b>）</p>
<p><b>两个分号不能省</b>：三个表达式都可以省略，但两个分号必须写。<code>for(;;)</code> 是标准的死循环写法（等价 while(1)）。</p>
<p><b>循环变量作用域</b>：<code>for (int i = 0; ...)</code> 里的 i 只在循环内有效（C99 起）。C89 要求在语句块开头定义变量，所以老代码把 i 提前声明。</p>
<p><b>嵌套 for</b>：外层每执行一次，内层<b>完整跑一遍</b>。9x9 乘法表、二维数组遍历都是这个模式。</p>
<p><b>嵌套变量名</b>：内层别用同名变量遮蔽外层，用 i / j / k 区分。</p>`,
  mem:`<pre class="cd mm">for 的执行顺序（更新在循环体"之后"）

        ┌──────────────┐
        │ 初始化 i = 1  │   只执行一次
        └──────┬───────┘
               ↓
        ┌──────────────┐   假
        │  i &lt;= 100 ? ─├────────→ 退出
        └──────┬───────┘
              真 ↓
      ┌───────────────┐
      │    循环体      │
      └───────┬───────┘
              ↓
        ┌──────────────┐
        │   更新 i++    │   注意：先跑完循环体才更新
        └──────┬───────┘
               └──── 回到条件判断</pre>
<div class="lg"><i style="background:#66bb6a"></i>for(;;) 分号都在但表达式全空 → 标准写法表示死循环</div>`,
  wrong:[{t:'嵌套循环里内层用了同名变量',code:`for (int i = 1; i &lt;= 3; i++)
    for (int i = 1; i &lt;= 3; i++)    /* 内层 i 遮蔽外层 */
        printf("%d", i);`,err:'编译能过（C99），但输出 123123123，不是你预期的组合',w:'内层 <code>int i</code> 遮蔽了外层同名变量，外层 i 在内层里"看不见"。嵌套循环请用 i / j / k 区分，别偷懒。'}],
  tip:'<b>一句话记</b>：两个分号不能省；for(;;) 是死循环；嵌套用 i/j/k。',
  quiz:{q:'for(i=0; i<3; i++) 循环体共执行几次？',o:['2 次','3 次','4 次','无限'],a:1,ex:'i 取 0、1、2 时各执行一次共 3 次；i=3 时条件为假退出。'}
},
{ t:'break 与 continue',
  key:'<b>break 跳出本层</b>，<b>continue 跳过本轮</b>；嵌套循环里 break <b>只跳一层</b>。',
  why:`<p><b>break</b>：终止整个本层循环（或 switch），后面的语句都不执行，直接到循环后面的代码。</p>
<p><b>continue</b>：跳过本轮剩下的语句，<b>直接进入下一轮</b>——但 for 的"更新部分"仍会执行，然后回到条件判断。</p>
<p><b>嵌套只跳一层</b>：break 只跳出<b>所在的</b>那层循环，外层照常继续。要跳多层：加标志变量，或者把内层抽成函数在函数里 return。</p>
<p><b>continue 的死循环风险</b>：在 while 里如果更新语句写在 continue <b>之后</b>，continue 永远跳过更新 → 死循环。而 for 里更新在固定位置，没这个风险。</p>
<p><b>克制使用</b>：break/continue 用得多了代码难读。能用条件表达式解决的尽量别用。</p>`,
  mem:`<pre class="cd mm">break vs continue 的路径区别

  for (...) {
      if (找到目标) break;        ← 直接跳出整个循环
      printf("继续处理...\\n");    ← break 之后这句不执行
      if (该跳过) continue;       ← 跳过下面这句
      printf("这句会被跳过\\n");
  }

  嵌套里的坑：break 只跳一层

  for (int i = 0; i &lt; 5; i++)
      for (int j = 0; j &lt; 5; j++) {
          if (j == 2) break;     ← 只跳出 j 循环，i 循环照常跑
      }
  结果：外层 5 轮照跑，只是每轮 j 只到 2</pre>
<div class="lg"><i style="background:#66bb6a"></i>while 里 continue 可能死循环（跳过更新），for 里不会</div>`,
  wrong:[{t:'想跳出嵌套的所有层',code:`for (int i = 0; i &lt; 5; i++)
    for (int j = 0; j &lt; 5; j++)
        if (i * j == 6) break;    /* 以为跳出了两个循环 */`,err:'只跳出了 j 循环，外层 i 继续跑完 5 轮',w:'break 一次只跳一层。要跳多层：用标志变量 + 外层条件判断，或者把内层抽成函数在函数里 return。'}],
  tip:'<b>一句话记</b>：break 跳出层，continue 跳本轮；嵌套只跳一层。',
  quiz:{q:'for(i=1;i<=5;i++){ if(i==3) break; printf("%d",i); } 输出：',o:['123','12','1245','12345'],a:1,ex:'打印 1、2 后 i==3 触发 break，整个循环终止。若用 continue 则会输出 1245。'}
}]
},
{ no:'5', ch:'数组与字符串', color:'#ffa726', icon:'🧱', points:[
{ t:'一维数组',
  key:'同类型数据的<b>连续存储块</b>，下标从 <b>0</b> 开始；C 语言<b>不检查越界</b>。',
  why:`<p><b>为什么能随机访问</b>：数组是连续内存，<code>a[i]</code> 的地址 = <code>&amp;a[0] + i * sizeof(a[0])</code>。这是一次乘法一次加法，所以访问时间恒定（O(1)）。</p>
<p><b>为什么下标从 0</b>：因为地址是从首元素开始<b>偏移</b>算的，<code>a[0]</code> 就是首元素本身，偏移 0。改成 1 开始反而每次都要减一次。</p>
<p><b>越界不检查</b>：<code>int a[5]</code> 访问 <code>a[5]</code> 能编译、能运行，会踩到旁边的内存 → 无数诡异 bug 的根源。想查越界要开 <code>-fsanitize=address</code>。</p>
<p><b>长度必须是常量</b>：<code>int a[5]</code> 合法；<code>int n; int a[n]</code> 是 VLA（C99 引入），很多编译器和竞赛环境不支持，按不支持处理。</p>
<p><b>初始化规则</b>：<code>int c[5] = {1,2};</code> 剩下的自动补 0；<code>int d[] = {1,2,3};</code> 个数由初始化列表推出来。</p>
<p><b>数组名是常量地址</b>：不能 <code>a++</code>，也不能 <code>a = b</code>（整体赋值），想整体拷贝得用 <code>memcpy</code> 或循环。</p>`,
  mem:`<pre class="cd mm">int a[5] = {9, 5, 2, 7, 3};    实际在内存里:

  地址      下标      内容
  0x...00   a[0]     [ 9 ]
  0x...04   a[1]     [ 5 ]      ← int 占 4 字节，所以每格 +4
  0x...08   a[2]     [ 2 ]
  0x...0C   a[3]     [ 7 ]
  0x...10   a[4]     [ 3 ]
  0x...14   a[5] ❌  [ ??? ]    ← 越界！踩到旁边的内存

  a[i] 的地址 = &amp;a[0] + i * sizeof(int)
  ↑ 所以数组能 O(1) 随机访问，代价是"越界没人管"</pre>
<div class="lg"><i style="background:#ffa726"></i>数组长度必须是常量；数组名不能自增、不能整体赋值</div>`,
  wrong:[{t:'下标越界（期末头号 bug 源）',code:`int a[5] = {1,2,3,4,5};
for (int i = 0; i &lt;= 5; i++)       /* 应该是 &lt; 5 */
    printf("%d", a[i]);`,err:'编译不报错，运行也不崩——但可能打印出奇怪的数，甚至悄悄改坏旁边的变量',w:'C <b>不检查越界</b>。<code>a[5]</code> 访问的是数组后面的内存。想查越界：<code>clang -fsanitize=address a.c -o a</code>。'}],
  tip:'<b>一句话记</b>：下标 0 起，长度是常量，越界没人管。',
  quiz:{q:'int a[5]; 合法的下标范围是：',o:['1~5','0~5','0~4','1~4'],a:2,ex:'5 个元素下标从 0 到 4。a[5] 越界，编译器通常不报错但行为未定义。'}
},
{ t:'二维数组',
  key:'内存里<b>仍是线性</b>排布——先放满第一行再放第二行；作函数参数时<b>列数不能省</b>。',
  why:`<p><b>本质是"数组的数组"</b>：内存按行连续存放（行优先 row-major）：<code>a[0][0] a[0][1] a[0][2] a[1][0] ...</code>。不存在"二维"的硬件概念，全是线性内存。</p>
<p><b>地址计算</b>：<code>a[i][j]</code> 的地址 = <code>&amp;a[0][0] + (i * 列数 + j) * sizeof(元素)</code>。注意这里必须有<b>列数</b>。</p>
<p><b>为什么函数参数里列数不能省</b>：<code>void f(int a[][3])</code> 可以，<code>void f(int a[][])</code> 不行——编译器不知道每行几个元素，就算不出 <code>a[i][j]</code> 的偏移。</p>
<p><code>int c[][3] = {1,2,3,4,5,6};</code> 行数可以省（由初始化推），<b>列数永远不能省</b>。</p>
<p><b>遍历顺序</b>：外层循环行、内层循环列，和内存排布一致，缓存命中率最高。</p>`,
  mem:`<pre class="cd mm">int a[2][3] = {{1,2,3},{4,5,6}};    实际在内存里:

  地址     0x...00  0x...04  0x...08  0x...0C  0x...10  0x...14
  内容       1        2        3        4        5        6

  逻辑上看成两行:        物理上是一行接一行:
    [1][2][3]              1 2 3 4 5 6
    [4][5][6]

  a[i][j] 的地址 = &amp;a[0][0] + (i*3 + j) * 4
  ↑ 算地址必须有列数 3 → 函数参数里列数不能省</pre>
<div class="lg"><i style="background:#ffa726"></i>外层循环行、内层循环列 = 顺着内存走，缓存友好</div>`,
  wrong:[{t:'函数参数里省掉了列数',code:`void print(int a[][]) {         /* 列数没写 */
    printf("%d\\n", a[0][0]);
}`,err:"error: expected expression（数组参数必须指定第二维的大小）",w:'编译器要算 <code>a[i][j]</code> 的地址，必须知道每行有几个元素。列数不写，它算不出偏移。'}],
  tip:'<b>一句话记</b>：内存一行接一行；列数永远不能省；外层行内层列。',
  quiz:{q:'int a[3][4]; 一共含多少个 int 元素？',o:['3','4','7','12'],a:3,ex:'3 行 × 4 列 = 12 个元素，占 12 × 4 = 48 字节。'}
},
{ t:'字符数组与字符串',
  key:'C 没有字符串类型，用<b>字符数组 + 结束标志 &#39;\\0&#39;</b>；%s 打印、strlen 求长都依赖这个 &#39;\\0&#39;。',
  why:`<p>C 标准库<b>没有"字符串"类型</b>。所谓字符串就是"以 &#39;\\0&#39; 结尾的字符数组"，仅此而已。</p>
<p><b>自动补 &#39;\\0&#39;</b>：<code>char s[] = "hello";</code> 编译器会自动在末尾补上 &#39;\\0&#39;，所以 <code>sizeof(s) = 6</code> 而 <code>strlen(s) = 5</code>。</p>
<p><b>字符数组可以改</b>：<code>s[0] = &#39;A&#39;</code> 没问题，数据在栈上可写。</p>
<p><b>字符串常量不能改</b>：<code>char *p = "hello";</code> 里的 "hello" 存在<b>只读常量段</b>（.rodata），<code>p[0] = &#39;A&#39;</code> 是未定义行为，多数机器直接崩。</p>
<p><b>字符 vs 汉字</b>：一个汉字在 UTF-8 里占 3 字节，别用单个 char 存汉字。</p>
<p><b>读字符串</b>：<code>scanf("%s")</code> 遇到空格或换行就停，读整句话要用 <code>fgets</code>。</p>`,
  mem:`<pre class="cd mm">char s[] = "hello";

  内存:  [ &#39;h&#39; ][ &#39;e&#39; ][ &#39;l&#39; ][ &#39;l&#39; ][ &#39;o&#39; ][ &#39;\\0&#39; ]
  下标:    0      1      2      3      4      5

  sizeof(s) = 6     ← 含 &#39;\\0&#39;，算的是真实占用
  strlen(s) = 5     ← 不含 &#39;\\0&#39;，靠遇到 &#39;\\0&#39; 才停

  两种写法的关键区别:

    char *p = "hello";   ← 指向只读常量区，p[0]=&#39;A&#39; 会崩
    char s[] = "hello";  ← 拷贝一份到栈上，可以改</pre>
<div class="lg"><i style="background:#ffa726"></i>*p 是"指针指向常量"，s[] 是"数组拷贝一份"——能不能改就看这个</div>`,
  wrong:[{t:'把字符串常量当字符数组改',code:`char *p = "hello";
p[0] = &#39;H&#39;;                /* 改只读常量区 */`,err:'Segmentation fault（macOS 上几乎必崩）',w:'<code>char *p = "hello"</code> 里的字符串在<b>只读</b>常量段（.rodata）。要可修改，写成 <code>char s[] = "hello";</code>——这是"拷贝一份到栈上"。'}],
  tip:'<b>一句话记</b>：字符串 = 字符数组 + &#39;\\0&#39;；sizeof 含 &#39;\\0&#39;，strlen 不含；*p 只读，s[] 可改。',
  quiz:{q:'char s[] = "hello"; sizeof(s) 的值是：',o:['5','6','10','不定'],a:1,ex:'5 个字母 + 隐藏的 &#39;\\0&#39; = 6 字节；strlen(s) 则是 5。'}
},
{ t:'字符串处理函数',
  key:'<code>string.h</code> 里的现成工具；<b>比较字符串必须用 strcmp</b>，<code>==</code> 比的是<b>地址</b>。',
  why:`<p><code>strlen(s)</code> 求长度（不含 &#39;\\0&#39;）；<code>strcpy(dest,src)</code> 复制；<code>strcat(dest,src)</code> 拼接；<code>strcmp(s1,s2)</code> 比较。</p>
<p><b>为什么 == 不能用</b>：字符数组名是<b>首地址</b>，<code>==</code> 比较的是地址不是内容。两个内容完全相同的字符串可能在不同的内存位置 → 比较结果永远是假。</p>
<p><b>strcmp 的返回值</b>：0 表示相等，<code>&lt; 0</code> 表示前者小，<code>&gt; 0</code> 表示前者大（按字典序逐字符比 ASCII 码）。所以"相等"必须写成 <code>strcmp(a,b) == 0</code>。</p>
<p><b>strcpy / strcat 不检查长度</b>：目标数组必须足够大，装不下就溢出 → 这就是"缓冲区溢出"漏洞的根源。</p>
<p><b>自己动手写一遍</b>是期末实验经典题：用指针遍历，遇到 &#39;\\0&#39; 停止。写出来你就真的懂了字符串是什么。</p>`,
  mem:`<pre class="cd mm">为什么 == 比较字符串是错的

  char s1[] = "abc";     存在栈地址 0x...10
  char s2[] = "abc";     存在栈地址 0x...20

  s1 == s2       →  0x...10 == 0x...20  →  假   ❌
  strcmp(s1,s2)  →  逐字符比较，返回 0     →  相等 ✅

  ↑ == 比的是地址（数组名退化成的指针），strcmp 比的是内容</pre>
<div class="lg"><i style="background:#ffa726"></i>strlen 相等不代表内容相等——内容相同长度当然相同，反之不然</div>`,
  wrong:[{t:'用 == 比较两个字符串',code:`char a[] = "abc", b[] = "abc";
if (a == b) printf("相同");     /* 永远不成立 */
else        printf("不同");`,err:'输出"不同"（虽然内容完全一样）',w:'数组名是首地址，<code>==</code> 比地址。内容相同但地址不同 → 结果为假。必须写 <code>strcmp(a,b) == 0</code>。'}],
  tip:'<b>一句话记</b>：比较内容用 strcmp；== 只比地址；复制拼接前先看目标够不够大。',
  quiz:{q:'判断两个字符串内容相同，正确的写法：',o:['if(s1 == s2)','if(strcmp(s1,s2)==0)','if(s1 = s2)','if(strlen(s1)==strlen(s2))'],a:1,ex:'== 比的是数组首地址；strcmp 返回 0 才表示内容完全相同；strlen 相等不代表内容相等。'}
}]
},
{ no:'6', ch:'函数', color:'#ffee58', icon:'🧩', points:[
{ t:'函数定义与调用',
  key:'把一段功能<b>打包命名</b>，随取随用；<code>main</code> 是唯一入口，<b>不能嵌套定义</b>但能嵌套调用。',
  why:`<p><b>为什么要拆函数</b>：把重复的逻辑写一遍，调用时按名字取用。代码可复用、好测试、好读。</p>
<p><b>main 是入口不是普通函数</b>：操作系统启动程序后进入 main。main 可以被别的函数<b>调用</b>（合法但不推荐，语义混乱）。</p>
<p><b>不能嵌套定义</b>：函数内部不能再定义函数。这是 C 语法的硬规定。要模块化就拆文件（第 10 章）。</p>
<p><b>可以嵌套调用</b>：f 调 g、g 调 h，随便调。</p>
<p><b>形参与实参必须"个数、类型、顺序"都一致</b>：写反了编译会报错或结果错。参数过多直接编译错。</p>
<p><b>void 函数</b>：没有返回值，函数体里不写 return（或者写 <code>return;</code>）。</p>`,
  mem:`<pre class="cd mm">C 程序的标准结构

  /* ============ 顶部：声明（原型） ============ */
  int add(int a, int b);          ← 告诉编译器"有这么个函数"

  /* ============ 中间：main 里调用 ============ */
  int main(void) {
      int s = add(3, 5);          ← 调用：s 收到返回值 8
      printf("%d\\n", s);
      return 0;
  }

  /* ============ 底部：定义（实现） ============ */
  int add(int a, int b) {         ← 定义写在 main 后面也能用
      return a + b;               ← 因为有顶部的声明
  }</pre>
<div class="lg"><i style="background:#ffee58"></i>定义写在调用之后，就必须在调用之前有声明——这是 C 从上往下读的结果</div>`,
  wrong:[{t:'在函数里嵌套定义另一个函数',code:`int main(void) {
    int helper(void) { return 1; }   /* 嵌套定义 */
    return 0;
}`,err:"error: expected identifier or '('",w:'C <b>禁止函数嵌套定义</b>。所有函数必须定义在 main 外面（或拆到别的 .c 文件）。想"临时算一下"就在 main 里写几行，别套函数。'}],
  tip:'<b>一句话记</b>：定义在外面、调用随便调；main 是入口；不能嵌套定义。',
  quiz:{q:'关于 C 语言函数，错误的是：',o:['函数可以嵌套调用','函数可以嵌套定义','void 函数没有返回值','main 也可以被其他函数调用'],a:1,ex:'C 函数可以嵌套调用（f 调 g），但不能嵌套定义（函数体内不能再定义函数）。'}
},
{ t:'函数声明（原型）',
  key:'先声明告诉编译器"有这个函数"，让<b>调用写在定义之前</b>也能通过编译。大项目里声明放头文件。',
  why:`<p><b>C 是从上往下读的</b>：编译器读到 <code>max(3,9)</code> 时如果没见过 max 的定义或声明，它不知道这个函数长什么样，会报错或按错误假设处理。</p>
<p><b>原型只写"长相"</b>：返回类型 + 函数名 + 参数类型列表 + 分号。<code>int max(int a, int b);</code>——分号不能漏。</p>
<p><b>原型里参数名可省</b>：<code>int max(int, int);</code> 也合法（老风格），但写上更清楚。</p>
<p><b>大项目的组织方式</b>：声明写进 <code>.h</code> 头文件，实现写进 <code>.c</code> 源文件。<code>#include</code> 头文件 = 把所有声明抄进来（第 10 章详讲）。</p>
<p><b>没声明又没定义会怎样</b>：老编译器会按"隐式声明"处理成 <code>int f()</code>，产出诡异结果；现在的编译器（clang/gcc）直接报错 <code>implicit declaration</code>。</p>`,
  mem:`<pre class="cd mm">为什么必须有声明 —— 编译器从上往下读

  情况 A（正确）:
    int max(int a, int b);       ← 1. 先声明（告诉编译器长相）
    int main(void) {             ← 2. main 里调用
        printf("%d\\n", max(3,9)); ← 编译器知道：返回 int、两个 int 参数
        return 0;
    }
    int max(int a, int b) {      ← 3. 定义放在最后
        return a > b ? a : b;
    }

  情况 B（错误）:
    int main(void) {
        printf("%d\\n", max(3,9)); ← ❌ 编译器还没见过 max
    }</pre>
<div class="lg"><i style="background:#ffee58"></i>声明末尾的分号最容易漏——漏了就变成"想定义一个函数"</div>`,
  wrong:[{t:'定义在 main 后面，又没有声明',code:`int main(void) {
    printf("%d\\n", max(3, 9));      /* 编译器还没见过 max */
    return 0;
}
int max(int a, int b) { return a > b ? a : b; }`,err:"error: call to undeclared function 'max'\nerror: conflicting types for 'max'",w:'编译器读到 main 里那行时，max 还不存在。必须在 main 之前补一条 <code>int max(int, int);</code> 声明。'}],
  tip:'<b>一句话记</b>：调用在定义之前 → 先写原型；声明末尾分号不能漏。',
  quiz:{q:'函数定义写在 main 之后时，必须在 main 之前：',o:['重新定义一次','写函数声明','写 #include','不用做任何事'],a:1,ex:'编译器从上往下读，先见声明才知道函数长什么样；定义可以放文件后部。'}
},
{ t:'值传递',
  key:'C 语言函数传参是<b>拷贝一份</b>：函数内改形参，不影响外面的实参。想真改只能<b>传地址</b>。',
  why:`<p><b>C 只有值传递</b>：调用 <code>f(a)</code> 时，形参 x 拿到的是 a 的<b>副本</b>（一次内存拷贝）。x 和 a 是两个独立变量。</p>
<p><b>所以函数里改 x 不影响 a</b>：x 变了，副本没了；a 纹丝不动。</p>
<p><b>想让函数修改外面的变量，只能传地址</b>：<code>void g(int *p) { *p = 100; }</code>，调用 <code>g(&amp;a)</code>。这是指针章的重点。</p>
<p><b>结构体传参</b>：结构体是按值整体拷贝的，大结构体传指针更省（避免拷贝整个结构体）。</p>
<p><b>经典面试题</b>：为什么 <code>swap(a,b)</code> 用普通参数交换不了两个数？因为交换的是两个副本。必须 <code>swap(&amp;a, &amp;b)</code>。</p>`,
  mem:`<pre class="cd mm">值传递：函数调用时发生了什么

  int main(void) {
      int a = 1;                 ← a 在 main 的栈帧里，地址 0x...A0
      tryChange(a);              ← 调用
  }

  调用瞬间（tryChange 自己的栈帧被压上去）:

    main 的栈帧:   a = 1        ← 0x...A0   原样不动
    tryChange 的栈帧: x = 1     ← 0x...B0   ← 这是"a 的副本"

    函数体:  x = 100;     ← 只改了 0x...B0 这个副本
    函数返回:  x 的栈帧弹出，100 随之消失
    回到 main:  a 还是 1   ← 原样不动 ✅

  想改 a 本身，必须把 a 的地址传进去: tryChange(&amp;a)
  → 形参 int *p = 0x...A0   →  *p = 100 改的就是 0x...A0 的内容</pre>
<div class="lg"><i style="background:#ffee58"></i>形参和实参是两个独立的内存格子，改一个动不了另一个</div>`,
  wrong:[{t:'想用普通参数交换两个变量',code:`void swap(int x, int y) {    /* 错：交换的是副本 */
    int t = x; x = y; y = t;
}
int main(void) {
    int a = 1, b = 2;
    swap(a, b);
    printf("%d %d\\n", a, b);  /* 输出 1 2，没变 */
}`,err:'输出: 1 2        ← 交换失败',w:'交换的是 x、y 两个<b>副本</b>。要让函数改外面的变量，参数必须是<b>指针</b>，函数内用 <code>*x</code>、<code>*y</code> 操作。'}],
  tip:'<b>一句话记</b>：C 只有值传递；改不了外面的变量就传地址。',
  quiz:{q:'C 语言函数实参和形参之间是：',o:['地址传递','值传递（单向拷贝）','引用传递','双向传递'],a:1,ex:'C 只有值传递：形参是实参的副本，函数内修改形参不影响实参。想改实参需传地址。'}
},
{ t:'递归',
  key:'函数自己调用自己：<b>必须有出口</b>（终止条件），否则无限递归 → 栈溢出。',
  why:`<p><b>递归两大要素</b>（缺一不可）：① <b>终止条件</b>（出口）；② <b>递推</b>（把问题变<span style="white-space:nowrap">更"小"</span>，向出口靠近）。</p>
<p><b>为什么必须有出口</b>：每次调用都会在栈上压一个新栈帧（约几十字节到几百字节）。没有出口就会一直压栈，直到栈空间耗尽 → <b>Stack Overflow</b> 崩溃。</p>
<p><b>执行过程</b>：先"递"下去（层层调用直到命中出口），再"归"回来（层层 return 把结果带回去）。fact(5) = 5 * fact(4) = 5 * 4 * fact(3) = …… = 5 * (4 * (3 * (2 * 1)))。</p>
<p><b>代价</b>：递归空间复杂度 O(n)（n 层栈帧）；斐波那契的朴素递归因为大量重复计算，时间复杂度是 O(2^n)。考试里 fib 建议用循环或加记忆化。</p>
<p><b>典型应用</b>：阶乘、斐波那契、汉诺塔、二分查找、树遍历、文件递归扫描。</p>`,
  mem:`<pre class="cd mm">fact(5) 的"递"和"归"两个阶段

  递（层层压栈，每个栈帧占几十字节）:

    fact(5) ─→ 5 * fact(4)
                    └→ 4 * fact(3)
                              └→ 3 * fact(2)
                                        └→ 2 * fact(1)
                                                  └→ 命中出口！return 1

  归（层层 return，把结果带回去）:

    fact(1) 返回 1
    fact(2) = 2 * 1 = 2
    fact(3) = 3 * 2 = 6
    fact(4) = 4 * 6 = 24
    fact(5) = 5 * 24 = 120      ✅

  没写 if (n &lt;= 1) return 1 会怎样?
    fact(5) → fact(4) → ... → fact(0) → fact(-1) → ... → 栈爆掉</pre>
<div class="lg"><i style="background:#ffee58"></i>递归 = 把大问题拆成同构的小问题，直到小到能直接答</div>`,
  wrong:[{t:'忘了写终止条件',code:`int fact(int n) {
    return n * fact(n - 1);      /* 没有出口！ */
}
int main(void) { printf("%d\\n", fact(5)); return 0; }`,err:'Segmentation fault (stack overflow)',w:'没有出口会一直压栈直到栈空间耗尽 → 段错误。递归的<b>第一件事</b>永远是写终止条件。'}],
  tip:'<b>一句话记</b>：递归两要素——出口 + 递推；缺一个就爆栈。',
  quiz:{q:'递归函数缺少终止条件会：',o:['编译错误','返回 0','无限递归直到栈溢出','自动只调用一次'],a:2,ex:'没有出口的递归会一直压栈，最终 Stack Overflow 崩溃。'}
},
{ t:'作用域与 static',
  key:'局部变量只在<b>所在大括号</b>内有效；<code>static</code> 改局部 → 延长寿命，改全局 → 限制在本文件。',
  why:`<p><b>作用域（能看见吗）</b>：全局变量全文件可见；局部变量只在所在大括号内可见；同名时<b>局部遮蔽全局</b>。</p>
<p><b>生命周期（活多久）</b>：全局变量和 static 局部变量活到<b>整个程序结束</b>；普通局部变量在函数返回时就销毁。</p>
<p><b>static 局部变量</b>：只初始化<b>一次</b>（第一次执行到时），值跨调用保留。所以它能当"计数器"用。</p>
<p><b>static 全局变量/函数</b>：限制在<b>本文件</b>可见，别的 .c 文件里 extern 也找不到 → 用来做"文件私有"。</p>
<p><b>static vs 全局变量</b>：静态存储区都在程序生命周期内，区别是<b>可见范围</b>——静态变量只在本函数/本文件可见，全局变量全文件可见。</p>`,
  mem:`<pre class="cd mm">static 局部变量 vs 普通局部变量

  普通局部变量:
    void f(void) { int a = 0; a++; printf("%d\\n", a); }
    f(); f(); f();
    →  每次进入 f，a 都重新分配、重新初始化成 0
    →  输出：1  1  1

  static 局部变量:
    void f(void) { static int a = 0; a++; printf("%d\\n", a); }
    f(); f(); f();
    →  第一次执行时初始化 a = 0，之后一直保留
    →  输出：1  2  3

  存储位置（都在静态存储区，不在栈上）:
    全局变量   → 全文件可见
    static 全局/函数 → 仅本文件可见
    static 局部   → 仅本函数可见，但活到程序结束</pre>
<div class="lg"><i style="background:#ffee58"></i>static 局部 = "有记忆的局部变量"：初始化只一次，值跨调用保留</div>`,
  wrong:[{t:'期望 static 变量的值每次重置',code:`void counter(void) {
    static int s = 0;
    printf("%d\\n", s);     /* 想每次都输出 0 */
}
int main(void) { counter(); counter(); return 0; }`,err:'输出：0  0        ← 但如果你在里面 s++ 了，第二次就是 1',w:'<code>static</code> 局部变量<b>只初始化一次</b>，值是跨调用保留的。想要"每次重置"就不要用 static，或者在函数里显式 <code>s = 0</code>。'}],
  tip:'<b>一句话记</b>：static 局部 = 只初始化一次、活到程序结束；static 全局 = 文件私有。',
  quiz:{q:'static 局部变量的特点是：',o:['每次调用都重新初始化','只初始化一次，值跨调用保留','作用域变成全局','不能赋初值'],a:1,ex:'static 局部变量放在静态存储区，首次执行到时初始化一次，之后跨调用保值；作用域仍限于函数内。'}
}]
},
{ no:'7', ch:'指针（重点）', color:'#ef5350', icon:'🎯', points:[
{ t:'指针基础',
  key:'指针是<b>存地址的变量</b>。<code>&amp;</code> 取地址，<code>*</code> 解引用（顺着地址去内存里取值）。',
  why:`<p><b>指针的本质</b>：一个变量，只不过它存的不是数据，而是<b>另一块内存的地址</b>。Apple Silicon 上指针占 8 字节（64 位系统）。</p>
<p><b>&amp; 取地址符</b>：<code>&amp;a</code> 得到 a 所在的内存地址。它是一个"门牌号"。</p>
<p><b>* 解引用</b>：<code>*p</code> 是"顺着 p 里存的地址，去内存里把值取出来"。写 <code>*p = 20</code> 就是"往 p 指的地址写 20"。</p>
<p><b>两个 * 别搞混</b>：<code>int *p</code> 里的 * 是<b>类型说明符</b>（说明 p 是指针）；表达式 <code>*p</code> 里的 * 是<b>解引用运算符</b>（取值）。同一个符号，两种身份。</p>
<p><b>解引用的三步</b>：先读出 p 里存的地址 → 拿这个地址去内存找 → 读出/写入那里的值。理解这条，指针就通了。</p>
<p><b>野指针</b>：未初始化的指针里是随机地址，一解引用就是"随机炸弹"。所以指针必须在使用前初始化。</p>`,
  mem:`<pre class="cd mm">int a = 10;   int *p = &amp;a;    内存长这样:

  地址         内容           含义
  0x...08   [    10    ]      ← int a，数据本身
  0x...10   [ 0x...08 ]       ← int *p，存的是"a 的地址"

  五种表达式，指向完全不同的东西:

    a        = 10            a 的值
    &amp;a       = 0x...08       a 的地址
    p        = 0x...08       p 的值（p 存的就是 a 的地址）
    &amp;p       = 0x...10       p 自己的地址
    *p       = 10            解引用 p → 顺着地址找到 a → 得到 10

  所以 *p = 20  ≡  a = 20    ← 完全等价，这是指针最核心的用处</pre>
<div class="lg"><i style="background:#ef5350"></i>声明里的 * 是"类型"，表达式里的 * 是"取值"——同一个符号两种身份</div>`,
  wrong:[{t:'指针没初始化就用（野指针）',code:`int *p;
*p = 100;              /* p 里是随机地址 */`,err:'Segmentation fault（段错误）',w:'未初始化的指针值是随机的，可能指向只读区、内核区或者根本没分配的内存。规则：<b>声明时就初始化</b>，或者先 <code>p = NULL;</code> 再用前判空。'}],
  tip:'<b>一句话记</b>：&amp; 拿门牌号，* 按门牌号进门取东西；指针必须在使用前初始化。',
  quiz:{q:'int a=5, *p=&a; 表达式 *p 的值是：',o:['a 的地址','5','p 的地址','随机值'],a:1,ex:'p 存的是 a 的地址，*p 解引用得到地址里存的值，即 5。'}
},
{ t:'指针与数组',
  key:'数组名就是<b>首元素地址</b>；<code>a[i]</code> 本质是 <code>*(a+i)</code>——指针与数组在底层是同一件事。',
  why:`<p><b>数组名退化成指针</b>：<code>int a[5]; int *p = a;</code> 合法，因为 a 在表达式里会退化成 <code>&amp;a[0]</code>（首元素地址）。</p>
<p><b>四种等价写法</b>：<code>a[i]</code> ≡ <code>*(a+i)</code> ≡ <code>*(p+i)</code> ≡ <code>p[i]</code>。它们生成的机器码几乎一样。</p>
<p><b>p+1 跨多大</b>：跨 <code>sizeof(*p)</code> 字节，不是 1 字节。int 指针 p+1 是 +4 字节，double 指针是 +8 字节。编译器会自动乘元素大小。</p>
<p><b>sizeof 的区别</b>：<code>sizeof(a)</code> 是整个数组大小（5×4=20），<code>sizeof(p)</code> 是指针本身大小（8）。数组本体处能算，函数里就废了（见 2.7）。</p>
<p><b>数组名 vs 指针变量</b>：a 是<b>常量地址</b>，不能 <code>a++</code>；p 是<b>变量</b>，可以 <code>p++</code>。所以遍历数组通常用指针变量而不是数组名。</p>
<p><b>二维数组</b>：地址 = <code>&amp;a[0][0] + (i*列数 + j) * sizeof(元素)</code>，这也解释了为什么函数参数里列数不能省。</p>`,
  mem:`<pre class="cd mm">int a[5] = {10,20,30,40,50};    int *p = a;

  地址        偏移量        内容
  0x...00     p + 0          [ 10 ]
  0x...04     p + 1          [ 20 ]      ← p+1 跨过 4 字节
  0x...08     p + 2          [ 30 ]
  0x...0C     p + 3          [ 40 ]
  0x...10     p + 4          [ 50 ]

  四种写法指向同一个数:
    a[2]      = *(a+2)  = *(p+2)  = p[2]  =  30

  用指针遍历整个数组（不越界的关键是"停在 a+5"）:
    for (p = a; p &lt; a + 5; p++)  printf("%d ", *p);

  a 和 p 的本质区别:
    a  →  常量地址，a++ 编译报错
    p  →  变量，p++ 合法，遍历完 p 停在 a+5</pre>
<div class="lg"><i style="background:#ef5350"></i>数组下标运算 = 指针加法 + 解引用，编译器帮你做了乘法</div>`,
  wrong:[{t:'试图对数组名自增',code:`int a[5] = {1,2,3,4,5};
for (int i = 0; i &lt; 5; i++)
    printf("%d ", a++);     /* 数组名不是变量 */`,err:"error: expression is not assignable",w:'数组名是<b>常量地址</b>，不能自增、不能赋值。要遍历就：<code>for (int i = 0; i &lt; 5; i++) printf("%d ", a[i]);</code>，或者用指针变量 <code>int *p;</code>。'}],
  tip:'<b>一句话记</b>：a[i] ≡ *(a+i) ≡ p[i]；p+1 跨一个元素；数组名不能 ++。',
  quiz:{q:'int a[5]={1,2,3,4,5}; *(a+3) 的值是：',o:['2','3','4','a[3] 的地址'],a:2,ex:'*(a+3) 等价 a[3]，即第 4 个元素 4。注意 a+1 是加一个元素，不是加 1 字节。'}
},
{ t:'传址调用（指针作参数）',
  key:'把地址传给函数，函数就能<b>直接修改外面的变量</b>。这是值传递的唯一破解办法。',
  why:`<p><b>为什么必须这样</b>：C 只有值传递（见 6.3）。传地址相当于把"门牌号"交给函数，函数拿着门牌号就能进屋改东西。</p>
<p><b>swap 是标准范例</b>：函数参数必须是 <code>int *x, int *y</code>，调用传 <code>swap(&amp;a, &amp;b)</code>，函数内用 <code>*x</code>、<code>*y</code> 操作。</p>
<p><b>函数内最容易忘 *</b>：写成 <code>x = y</code> 只是交换了两个<b>副本指针</b>，a、b 纹丝不动——指针本身也是按值传的副本！</p>
<p><b>更普遍的用法</b>：一个函数要"返回"多个值、要修改调用方的变量、要传整个结构体不想拷贝——全都靠指针。</p>
<p><b>判空</b>：被调函数收到指针后应该先检查 <code>if (x == NULL) return;</code>，这是工程规范。</p>`,
  mem:`<pre class="cd mm">swap 为什么必须传指针

  ❌ 传值版本:
     void swap(int x, int y) { int t=x; x=y; y=t; }
     main: a=1, b=2  →  swap(a,b)
     栈上发生:  x=1(y的副本)  y=2(x的副本)
     函数内交换的是 x、y 两个副本
     返回:  a 还是 1，b 还是 2      ← 没变

  ✅ 传地址版本:
     void swap(int *x, int *y) { int t=*x; *x=*y; *y=t; }
     main: swap(&amp;a, &amp;b)
     栈上发生:  x = &amp;a 的地址,  y = &amp;b 的地址
     函数内:  *x = *y  →  往 a 的地址写 b 的值
              *y = t   →  往 b 的地址写原来的 a
     返回:  a=2, b=1      ← 真的换了 ✅</pre>
<div class="lg"><i style="background:#ef5350"></i>指针本身也是按值传的副本——所以函数内必须用 * 去动"真身"</div>`,
  wrong:[{t:'函数内忘了写 *',code:`void swap(int *x, int *y) {
    int t = x; x = y; y = t;      /* 交换的是两个指针副本 */
}
int main(void) {
    int a = 1, b = 2;
    swap(&amp;a, &amp;b);
    printf("a=%d b=%d\\n", a, b);   /* 输出 1 2 */
}`,err:'输出: a=1 b=2        ← 纹丝不动',w:'<code>x = y</code> 只是让局部指针 x 指向了 b 的地址，a、b 本身没被碰到。必须写成 <code>*x = *y</code> 才是"改门牌后屋里的东西"。'}],
  tip:'<b>一句话记</b>：想改外面的变量 → 参数用指针 + 调用传 &amp; + 函数内用 *。',
  quiz:{q:'要用函数交换 main 中两个变量的值，函数参数和调用应写成：',o:['void swap(int x,int y); swap(a,b);','void swap(int *x,int *y); swap(&a,&b);','void swap(int x,int y); swap(&a,&b);','无法实现'],a:1,ex:'值传递改不了实参；必须让函数接收地址，调用时传 &amp;a、&amp;b，函数内用 *x、*y 交换。'}
},
{ t:'指针与字符串',
  key:'字符串常量本质是<b>首字符地址</b>；用指针遍历字符串是高频考点。',
  why:`<p><code>char *p = "hello";</code> 让 p 指向字符串常量区的 &#39;h&#39;。字符串常量存在<b>只读段</b>（.rodata），不能改。</p>
<p><b>p[1] 即 &#39;e&#39;，*p 即 &#39;h&#39;</b>：字符串 = 字符数组 = 一串地址，所以指针和下标完全通用。</p>
<p><b>遍历的两种写法</b>：<code>while (*p != &#39;\\0&#39;) { ...; p++; }</code>；简写 <code>while (*p) { ...; p++; }</code>——因为 &#39;\\0&#39; 的值是 0，而 0 在 C 里是"假"。</p>
<p><b>经典题：自己写 strlen</b>——指针一路走到 &#39;\\0&#39;，数走了几步。</p>
<p><b>字符串常量 vs 字符数组</b>：<code>char *p = "abc";</code> 的 p[0]=&#39;X&#39; 是未定义行为（只读区）；<code>char s[] = "abc";</code> 是可改的副本（见 5.3）。</p>`,
  mem:`<pre class="cd mm">char *p = "C2026";    指针遍历字符串

  地址        内容
  0x...00   [ &#39;C&#39; ]       ← p 初始指向这里
  0x...01   [ &#39;2&#39; ]
  0x...02   [ &#39;0&#39; ]
  0x...03   [ &#39;2&#39; ]
  0x...04   [ &#39;6&#39; ]
  0x...05   [ &#39;\\0&#39; ]       ← 走到这里停止

  遍历过程:
    p ─→ &#39;C&#39;   长度 1
    p++ ─→ &#39;2&#39;   长度 2
    ...
    p ─→ &#39;\\0&#39;   长度 5，*p == 0（假），退出

  写 strlen 的核心:
    int my_strlen(char *s) {
        int n = 0;
        while (*s != &#39;\\0&#39;) { n++; s++; }   ← 每走一步数一次
        return n;
    }</pre>
<div class="lg"><i style="background:#ef5350"></i>while(*s) 能工作，是因为 &#39;\\0&#39; 的值是 0，而 0 在 C 里就是"假"</div>`,
  wrong:[{t:'试图修改字符串常量的字符',code:`char *p = "abc";
p[0] = &#39;X&#39;;              /* 改只读常量区 */`,err:'Segmentation fault',w:'<code>char *p = "abc"</code> 的 "abc" 在<b>只读</b>常量区。要可修改就写 <code>char s[] = "abc";</code>（拷贝一份到栈上）。'}],
  tip:'<b>一句话记</b>：字符串 = 首字符地址 + &#39;\\0&#39; 结尾；while(*p) 走到 &#39;\\0&#39; 停。',
  quiz:{q:'char *p = "abc"; while(*p) p++; 结束后 p 指向：',o:['&#39;a&#39;','&#39;\\0&#39;','&#39;c&#39;','数组首地址'],a:1,ex:'循环在 *p 为 &#39;\\0&#39;（值为 0，条件为假）时停止，此刻 p 正指向字符串结尾符 &#39;\\0&#39;。'}
},
{ t:'动态内存 malloc / free',
  key:'运行时<b>按需申请内存</b>；malloc 申请、free 释放必须配对；忘了 free 就是<b>内存泄漏</b>。',
  why:`<p><b>为什么需要它</b>：数组长度必须是编译期常量，但很多场景要"运行时才知道要多少"（先问用户要几个数）。malloc 就是干这个的。</p>
<p><b>malloc 返回 void*</b>：C 里 void* 可以隐式转成任何指针类型，所以 <code>(int *)</code> 强转在 C 里可以省略（C++ 里必须写）。</p>
<p><b>必须检查 NULL</b>：申请失败（内存不够、被占光）返回 NULL。不检查就解引用 → 崩。</p>
<p><b>用完必须 free</b>：C 没有垃圾回收。不 free = 泄漏，程序越跑越吃内存。</p>
<p><b>三个致命错误</b>：① 泄漏（申请不释放）；② 重复 free 同一块；③ free 后继续用（<b>use-after-free</b>，安全漏洞的头号来源）。</p>
<p><b>calloc / realloc</b>：calloc 会把内存清零；realloc 调整已分配块的大小。</p>`,
  mem:`<pre class="cd mm">int n = 5;    int *a = malloc(n * sizeof(int));

  分配前:
    栈:  n = 5
    堆:  [ 一堆空闲的可用内存块 ]

  malloc(5 * 4 = 20) 之后:
    堆:  [  20 字节被 a 占了  ] [ 空闲... ]
    栈:  n = 5    a = &amp;那 20 字节的起始地址

  接下来:
    a[i] 照常访问（数组下标运算在堆上一样成立）
    a[4] 是最后一格，a[5] 越界 —— malloc 也不检查越界

  收尾（必须成对）:
    free(a);          ← 归还这 20 字节
    a = NULL;         ← 好习惯：防止 free 后继续用</pre>
<div class="lg"><i style="background:#ef5350"></i>malloc 是"跟系统借内存"，free 是"还回去"——借了不还就泄漏</div>`,
  wrong:[{t:'重复 free 同一块内存',code:`int *p = malloc(100 * sizeof(int));
free(p);
free(p);              /* 第二次 free 同一地址 */`,err:'堆损坏（heap corruption）→ 崩溃或诡异行为',w:'free 之后这块内存已经还给系统了，指针变成<b>野指针</b>。再 free 一次会破坏堆的管理结构。标准做法：free(a); a = NULL;（free(NULL) 是安全的空操作）'}],
  tip:'<b>一句话记</b>：malloc 借内存，free 还回去；申请后查 NULL，释放后置 NULL。',
  quiz:{q:'malloc 申请的内存用完后应该：',o:['自动回收，不用管','调用 free 释放','调用 delete','赋值为 0 即可'],a:1,ex:'malloc/free 配对使用：free 后内存归还系统。不 free 就内存泄漏（程序越跑越占内存）。delete 是 C++ 的。'}
},
{ t:'野指针与 NULL',
  key:'指向"不知道哪里"的指针叫<b>野指针</b>，解引用是随机炸弹；<code>NULL</code> 是<b>判空的标准姿势</b>。',
  why:`<p><b>野指针的三种来源</b>：① 声明后没初始化；② free 后没置空；③ <b>返回局部变量的地址</b>（函数结束局部变量就销毁，返回的地址是死地址）。</p>
<p><b>NULL 是空指针</b>：值为 0，表示"不指向任何地方"。它和野指针的区别是——野指针是随机地址（危险），NULL 是<b>确定的</b> 0（安全，因为可以判空）。</p>
<p><b>判空铁律</b>：任何指针在使用前都应该先 <code>if (p != NULL)</code>。malloc 之后必须判、参数指针进入函数后必须判。</p>
<p><b>为什么判空有用</b>：解引用 NULL 虽然也会崩（段错误），但错误是<b>确定的、可复现的</b>，比"随机地址炸出来"好调得多。</p>
<p><b>返回局部变量地址</b>是考试和面试的经典陷阱：局部变量在栈上，函数返回时栈帧弹出，那块内存已经不属于你了。</p>`,
  mem:`<pre class="cd mm">三种野指针来源

  ① 未初始化:
     int *p;              ← p 里是随机地址
     *p = 1;              ← 往随机地址写 → 崩

  ② free 后没置空:
     free(p);             ← 内存还回去了，p 变成野指针
     if (p != NULL) ...   ← ❌ p 仍然不是 NULL，判断失效

  ③ 返回局部变量的地址（最阴）:
     int *bad(void) {
         int x = 5;
         return &amp;x;      ← 函数结束 x 就销毁了
     }
     int *p = bad();
     printf("%d\\n", *p); ← 读一个已经不存在的变量 → 崩

  正确姿势:
     int *p = NULL;       ← 声明就置空
     p = malloc(...);
     if (p != NULL) {     ← 用前判空
         *p = 7;
     }
     free(p);
     p = NULL;            ← 释放后立即置空</pre>
<div class="lg"><i style="background:#ef5350"></i>NULL 是"确定不指向哪里"，野指针是"不知道指向哪里"——只有前者能安全判空</div>`,
  wrong:[{t:'函数返回局部变量的地址',code:`int *get_addr(void) {
    int x = 42;
    return &amp;x;            /* x 是局部变量 */
}
int main(void) {
    int *p = get_addr();
    printf("%d\\n", *p);   /* 未定义行为 */
}`,err:'输出可能是 42，可能是乱码，也可能直接崩',w:'局部变量在<b>栈</b>上，函数返回时栈帧弹出，那块内存随时会被覆盖。这是考试和面试的经典陷阱题。要返回数据：让调用方传指针进来填，或者用 malloc 分配。'}],
  tip:'<b>一句话记</b>：指针先置 NULL、用前判空、free 后置 NULL、别返回局部变量地址。',
  quiz:{q:'下列哪种情况会产生野指针？',o:['int *p = NULL;','int *p;（未初始化就用）','p = &a;','p = malloc(4);'],a:1,ex:'未初始化的指针值是随机的，解引用行为未定义。NULL 指针至少是"确定不指向哪里"，判空即可避免崩溃。'}
}]
},
{ no:'8', ch:'结构体', color:'#ec407a', icon:'🏗', points:[
{ t:'struct 结构体',
  key:'把<b>不同类型的数据打包</b>成一个逻辑单元；同名变量之间<b>各占各的内存</b>，用 <code>.</code> 访问成员。',
  why:`<p><b>为什么需要结构体</b>：数组只能装<b>同一种类型</b>。要描述"一个学生"（名字+年龄+成绩），需要把不同类型的数据捆在一起。</p>
<p><b>定义的结构体本身不占内存</b>：<code>struct Student { ... };</code> 只是定义了一种<b>数据模板</b>。真正占内存的是"用这个模板声明的变量"。</p>
<p><b>同名变量各占各的内存</b>：<code>Student s1, s2;</code> 两个变量有各自独立的内存块，改 s1.name 不影响 s2.name。这和 typedef 后的类型名是两回事。</p>
<p><b>访问用点号</b>：<code>s.name</code>、<code>s.age</code>。点号左边必须是<b>变量本身</b>，不是指针。</p>
<p><b>同类型结构体可以整体赋值</b>：<code>Student t = s;</code> 合法，按成员逐个拷贝。不同类型不行，也不能整体相加。</p>
<p><b>结构体可以嵌套</b>：<code>struct Address</code> 里再放 <code>struct Student</code>，访问用 <code>s.addr.city</code>。</p>`,
  mem:`<pre class="cd mm">typedef struct {
    char  name[20];     ← 20 字节
    int   age;          ← 4 字节
    double score;       ← 8 字节
} Student;

Student s = {"Sir", 20, 95.5};     ← 定义并初始化一个变量

  s 的内存（成员依次摆放）:
  ┌──────────────────────────────┐
  │ name[0..19]   20 字节         │  s.name
  ├──────────────────────────────┤
  │ age            4 字节  = 20    │  s.age
  ├──────────────────────────────┤
  │ score          8 字节  = 95.5  │  s.score
  └──────────────────────────────┘

  两个变量各占各的:
    Student s1 = {...};   Student s2 = {...};
    改 s1.name  →  s2.name 完全不受影响

  整体赋值:
    Student t = s;        ← 合法，按成员逐个拷贝（值拷贝）</pre>
<div class="lg"><i style="background:#ec407a"></i>类型定义不占内存，变量才占；同名变量是两块独立的内存</div>`,
  wrong:[{t:'点号左边写了变量名之外的东西',code:`Student s;
s.name[0];      /* ✅ 正确：点号左边是变量 */
(*s).age;       /* ❌ s 不是指针 */
s + 1;          /* ❌ 结构体不能做算术 */`,err:"error: no member named 'age' in 'struct Student *'  /  结构体类型不能相加",w:'点号 <code>.</code> 左边必须是<b>结构体变量本身</b>。指针要用箭头 <code>-&gt;</code>。结构体支持整体赋值和 == 以外的基本操作，不能加减。'}],
  tip:'<b>一句话记</b>：struct 是模板不占内存；变量才占内存；用 . 访问成员。',
  quiz:{q:'定义结构体类型后（struct Student{};），会：',o:['立即占内存','定义了一个变量','只是定义模板不占内存','报错'],a:2,ex:'结构体定义只是定义数据模板（类型），只有用它声明变量时才分配内存。'}
},
{ t:'typedef 起别名',
  key:'给类型<b>起一个更短的名字</b>，本身不占内存、不生成新变量；结构体前几乎必写。',
  why:`<p><b>本质</b>：<code>typedef 原类型 别名;</code> 是给已有类型起别名，<b>不占内存、不生成变量</b>。</p>
<p><b>常见用法</b>：<code>typedef int INT;</code>；<code>typedef unsigned char BYTE;</code>；结构体最常用：<code>typedef struct { ... } Student;</code>。</p>
<p><b>为什么结构体要配 typedef</b>：不配的话每次都要写 <code>struct Student s;</code>，写两次 <code>struct Student</code> 声明函数参数。配了 typedef 就干净多了。</p>
<p><b>typedef vs #define 的区别</b>（高频考点）：typedef 给类型起<b>别名</b>，编译器做类型检查；#define 是预处理期的<b>纯文本替换</b>。写 <code>#define INT int</code> 也能用，但 <code>#define P (int *)</code> 这种带类型的定义用 #define 就要处处加括号，容易出错。</p>
<p><b>判断技巧</b>：typedef 后如果有变量名，那名字在<b>左边</b>是类型；#define 后如果有变量名，那名字在<b>右边</b>是变量。写 <code>typedef int *P;</code> 和 <code>#define P int *</code> 用 <code>P p = &amp;x;</code> 都行，但 <code>P p;</code> 只有 typedef 写法合法。</p>`,
  mem:`<pre class="cd mm">两种写法对比

  写法 A（推荐）:
    typedef struct {
        char name[20];
        int  age;
    } Student;                    ← Student 是类型别名
    Student s1, s2;               ← 简洁

  写法 B（不写 typedef）:
    struct Student {
        char name[20];
        int  age;
    };
    struct Student s1, s2;        ← 每次都要写 struct

  同一个类型可以有多个别名:
    typedef int my_int;
    typedef int another_int;
    my_int    a = 1;      ← 合法
    another_int b = 2;    ← 合法

  注意 typedef 不占内存、不生成变量
  →  和 Student s1; 完全不同：后者才分配内存</pre>
<div class="lg"><i style="background:#ec407a"></i>typedef 只是"起别名"，#define 才是"文本替换"——一个走类型系统，一个走预处理器</div>`,
  wrong:[{t:'把 typedef 当成 #define 用',code:`#define T struct Student { char n[10]; };
T s;                /* 展开成 struct Student { ... }; s;  语法炸掉 */`,err:'error: expected identifier',w:'#define 是<b>纯文本替换</b>，把整个类型定义塞进语句位置就错了。typedef 是给类型起别名的语法，不能拿来定义变量。要定义变量必须用真正的类型名。'}],
  tip:'<b>一句话记</b>：typedef 给类型起别名（不占内存），#define 是文本替换；结构体后几乎必加 typedef。',
  quiz:{q:'关于 typedef，正确的是：',o:['占用内存','定义了新变量','给类型起别名，本身不占内存','等同于 #define 宏定义'],a:2,ex:'typedef 只是给类型起别名，不占内存也不生成变量；它与 #define 机制不同（前者是类型别名，后者是文本替换）。'}
},
{ t:'结构体指针与 -&gt;',
  key:'结构体指针用 <code>-&gt;</code> 访问成员；<code>p-&gt;x</code> 等价 <code>(*p).x</code>。链表、树的基石。',
  why:`<p><b>为什么要有指针</b>：结构体大的话，按值传参要拷贝整个结构体；更重要的是<b>链表</b>——每个节点要存"下一个节点的地址"。</p>
<p><b>箭头语法</b>：<code>p-&gt;x</code> 是 <code>(*p).x</code> 的简写。注意 <code>*p.x</code> 会被解析成 <code>*(p.x)</code>，因为点号优先级高于 *——所以必须用箭头或加括号。</p>
<p><b>常见结构</b>：链表节点 <code>typedef struct Node { int val; struct Node *next; } Node;</code>——自己指向自己，形成递归类型。</p>
<p><b>结构体数组遍历</b>：<code>for (int i = 0; i &lt; n; i++) printf("%s", arr[i].name);</code>，或者用指针 <code>Node *p = &amp;arr[0];</code>。</p>
<p><b>函数传结构体指针</b>：避免拷贝整个结构体，还能让函数修改结构体内容（同传址调用）。</p>`,
  mem:`<pre class="cd mm">链表：结构体 + 自己指向自己

  typedef struct Node {
      int          val;
      struct Node *next;      ← 存下一个节点的地址
  } Node;

  三个节点在堆上的样子:

      n1                n2                n3
  ┌────────────┐    ┌────────────┐    ┌────────────┐
  │ val = 10   │    │ val = 20   │    │ val = 30   │
  │ next = 0x..B0 │ →│ next = 0x..C8 │ →│ next = NULL │
  └────────────┘    └────────────┘    └────────────┘
      0x...98          0x...B0            0x...C8

  遍历:
    Node *p = head;
    while (p != NULL) {
        printf("%d ", p-&gt;val);      ← 箭头访问成员
        p = p-&gt;next;                 ← 走到下一个
    }

  两种等价写法:
    p-&gt;val     ≡  (*p).val     ≡  arr[i].val
  ↑ 注意 *p.val 是错的：点号优先级高，会被解析成 *(p.val)</pre>
<div class="lg"><i style="background:#ec407a"></i>链表 = 结构体 + 指向自己的指针；遍历就是"沿着 next 走，走到 NULL 停"</div>`,
  wrong:[{t:'用点号访问结构体指针的成员',code:`struct Student s;
struct Student *p = &amp;s;
p.age = 20;          /* ❌ 点号左边是结构体本身，不是指针 */`,err:"error: member reference base type 'struct Student *' is not a structure or union",w:'点号左边必须是<b>结构体变量</b>。<code>p</code> 是指针，要用 <code>p-&gt;age</code>（等价 <code>(*p).age</code>）。想清楚：你手里拿的是"东西本身"还是"东西的地址"。'}],
  tip:'<b>一句话记</b>：拿东西本身用 .，拿地址用 -&gt;；*p.x 是错的，要 (*p).x。',
  quiz:{q:'结构体指针 p 访问成员 x 的正确写法：',o:['p.x','p-&gt;x','*p.x','(&amp;p).x'],a:1,ex:'结构体指针用箭头 p-&gt;x，等价 (*p).x。*p.x 会因点号优先级高于 * 被解析成 *(p.x)，语法错误。'}
},
{ t:'union 共用体',
  key:'union 的成员<b>共用同一块内存</b>，同一时刻只能存一个有效值，大小 = 最大成员。',
  why:`<p><b>union 与 struct 的区别</b>：struct 各成员各占各的内存；union 所有成员<b>共用同一块内存</b>，同一时刻只能存一个有效值。</p>
<p><b>大小</b>：<code>sizeof(union)</code> = 最大成员的大小（含对齐填充）。struct 是所有成员之和。</p>
<p><b>为什么会有 union</b>：内存极度敏感的场景（嵌入式、网络协议解析、游戏引擎）里，同一块内存要<b>换多种格式解读</b>，而不是"同时保存几种数据"。</p>
<p><b>典型用法</b>：① 省内存（标志位 + 数据共用）；② 操作<b>硬件寄存器</b>（同一地址，一半当整体读、一半按位读）；③ <b>解析网络包</b>（同一字节流先当 int 读、再按字段读）。</p>
<p><b>分析大小端的经典技巧</b>：往 union 的 int 写 <code>0x41424344</code>，再读 char 成员。<b>小端</b>机器读出的是 0x44，大端读出 0x41——一行代码就能测出机器字节序。</p>
<p><b>安全提示</b>：读"上一个没写过的成员"是<b>未定义行为</b>（除少数明确允许的转换，如 int 与 float 互转）。别把 union 当魔法用。</p>`,
  mem:`<pre class="cd mm">union Data { int i; char c; double d; };

  sizeof(union Data) = 8     ← 最大成员 double 的大小

  内存:  [ 8 字节，三个成员共享 ]
         ↑                    ↑
     i  从这里开始读 4 字节   d  从同一位置读 8 字节
         c  从同一位置读 1 字节

  同一个位置，不同规则 → 不同数值（这就是 union 的精髓）

  判断大小端:
    union Data u;
    u.i = 0x41424344;
    printf("%c\\n", u.c);
    小端（Mac / x86） → 输出 'D'  (0x44)
    大端（部分服务器） → 输出 'A'  (0x41)
</pre>
<div class="lg"><i style="background:#ec407a"></i>union 是"同一块内存的多种解读"——写一个成员，其他成员的读值随之改变</div>`,
  wrong:[{t:'试图给枚举成员赋值',code:`enum { RED, GREEN, BLUE } c = RED;
c = GREEN;           /* ❌ 枚举成员是常量 */`,err:'warning: enum value used in an assignment (常量不能作为左值)',w:'枚举成员是<b>常量</b>而不是变量，不能作为赋值左边。要给"枚举变量"换值：先声明一个枚举类型的变量 <code>enum Color c;</code> 再赋 <code>c = GREEN;</code>。'}],
  tip:'<b>一句话记</b>：union 大小 = 最大成员，所有成员共用同一块内存，同一时刻只能存一个。',
  quiz:{q:'union 的大小等于：',o:['最大成员的大小','所有成员之和','1 字节','最小成员的大小'],a:0,ex:'union 所有成员共用同一块内存，大小为最大成员的大小（含对齐）。这与 struct 完全不同。'}
},
{ t:'enum 枚举',
  key:'enum 给整数常量<b>起名字</b>，默认从 <b>0</b> 自增；枚举成员是<b>常量</b>，不能赋值。',
  why:`<p><b>为什么用 enum</b>：<code>if (status == 2)</code> 读者根本不知道 2 是什么。改成 <code>if (status == SUCCESS)</code>，代码自解释——这就是 enum 的价值：<b>用有意义的名字代替裸数字</b>。</p>
<p><b>默认从 0 开始</b>：<code>enum { SUN, MON, TUE };</code> → SUN=0, MON=1, TUE=2。注意<b>不是从 1</b>开始，这是新手最容易错的地方。</p>
<p><b>可以手动指定值</b>：<code>enum { A, B=5, C };</code> → A=0, B=5, C=6（从指定值<b>继续加 1</b>）。</p>
<p><b>枚举成员是常量</b>：不能作为赋值左边，<code>RED = 5;</code> 直接报错。<b>枚举变量</b>可以换值：<code>enum Color c; c = GREEN;</code>。</p>
<p><b>底层是 int</b>：枚举变量可以跟 int 互转、可以 printf 打印，但强烈不建议——那样就失去了命名的意义。</p>
<p><b>与 #define 的对比</b>：<code>#define RED 0</code> 是文本替换，没有类型；<code>enum { RED }</code> 是真正的枚举类型，可以 <code>enum Week w;</code> 声明变量，编译器做类型检查。</p>`,
  mem:`<pre class="cd mm">enum Week { SUN, MON, TUE, WED, THU, FRI, SAT };

  值自动从 0 递增:
    SUN=0   MON=1   TUE=2   WED=3   THU=4   FRI=5   SAT=6

  手动指定后从该值继续加:
    enum { A, B=5, C };      →  A=0   B=5    C=6
    enum { X=10, Y, Z };     →  X=10  Y=11   Z=12

  声明变量（推荐）:
    enum Week today;        ← 变量，可以赋值
    today = FRI;
    if (today == SUN) ...   ← 有名字的判断，一眼看懂

  枚举成员是常量，不是变量:
    RED = 5;                          ❌ 报错：常量不能作左值
    enum Color c = RED; c = GREEN;   ✅ 变量可以换值</pre>
<div class="lg"><i style="background:#ec407a"></i>enum = 给整数起名字；成员是常量，变量才能换值</div>`,
  wrong:[{t:'试图给枚举成员赋值',code:`enum { RED, GREEN, BLUE } c = RED;
c = GREEN;              /* ❌ 枚举成员是常量 */`,err:'error: enum value used in an assignment（常量不能作为左值）',w:'枚举成员是<b>常量</b>而不是变量，不能作为赋值左边。要换值：先声明一个<b>枚举类型的变量</b>，再给变量赋值。'}],
  tip:'<b>一句话记</b>：enum 从 0 开始自增；成员是常量、变量才能换值；用名字代替裸数字。',
  quiz:{q:'enum { RED, GREEN, BLUE }; 则 BLUE 的值是：',o:['0','1','2','3'],a:2,ex:'枚举默认从 0 开始递增：RED=0、GREEN=1、BLUE=2。注意不是从 1 开始。'}
}]
},
{ no:'9', ch:'文件操作', color:'#26a69a', icon:'💾', points:[
{ t:'fopen / fclose',
  key:'打开文件拿到 <b>FILE* 指针</b>；<b>必须检查是否为 NULL</b>，用完后必须 <b>fclose</b>。',
  why:`<p><b>为什么要 fopen</b>：程序要把数据"落在磁盘上"（长期保存），必须先把文件打开。打开后返回一个 <code>FILE *</code>，后续读写都通过它。</p>
<p><b>必须检查 NULL</b>：路径写错、文件不存在、没权限 → fopen 返回 NULL。不检查就直接 fwrite → 段错误。</p>
<p><b>模式 "r"</b>：只读，文件<b>必须已存在</b>（不存在返回 NULL）。<b>"w"</b>：只写，<b>文件不存在则新建</b>，<b>已存在则清空</b>。这是最容易踩的坑——想追加却用了 w，历史数据全没了。<b>"a"</b>：追加，写到文件末尾。</p>
<p><b>必须 fclose</b>：数据先写进内存缓冲区，fclose 时才真正刷到磁盘。不 fclose，数据可能丢。</p>
<p><b>缓冲机制</b>：文件写操作的缓冲和你程序逻辑在同一个进程里，所以"写完没 fclose 就 crash"→ 数据丢失。这也是为什么程序崩溃后文件是空的。</p>`,
  mem:`<pre class="cd mm">文件的三种模式

         r        w                a
  读       ✅       ❌               ❌
  写       ❌       ✅               ✅
  文件不存在  NULL   自动新建         自动新建
  文件已存在  只读     ← 清空从头写!   追加到末尾

  最经典的数据丢失事故:
    FILE *f = fopen("save.dat", "w");   ← 只想"打开"，结果文件被清空
    然后还没来得及写数据，程序崩了
    →  原来的存档数据全部消失

  标准模板:
    FILE *f = fopen("a.txt", "w");
    if (f == NULL) { perror("fopen"); return 1; }   ← 检查失败
    fprintf(f, "hello\\n");
    fclose(f);                                    ← 不 fclose 数据可能丢</pre>
<div class="lg"><i style="background:#26a69a"></i>"w" 会清空文件——想保留数据用 "a"</div>`,
  wrong:[{t:'忘了检查 fopen 返回值',code:`FILE *f = fopen("no_such_dir/x.txt", "w");
fprintf(f, "data");     /* f 是 NULL */
fclose(f);`,err:'Segmentation fault（段错误）',w:'路径不存在时 fopen 返回 NULL，对 NULL 写就是段错误。规则：<b>fopen 之后第一件事就是判空</b>。'}],
  tip:'<b>一句话记</b>：打开拿 FILE*、用完必 fclose；w 会清空文件，判空别偷懒。',
  quiz:{q:'fopen("a.txt", "w") 打开一个已存在的文件，结果是：',o:['报错','从文件开头读取','清空原内容从头写','追加到末尾'],a:2,ex:'"w" 模式：文件不存在则创建，已存在则清空内容从头写。想保留原内容用 "a"（追加）。'}
},
{ t:'fprintf / fscanf',
  key:'printf/scanf 的<b>文件版本</b>；第一个参数是 <b>FILE* 指针</b>；<b>fscanf 的返回值</b>是终止循环的关键。',
