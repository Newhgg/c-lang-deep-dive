  why:`<p><b>fprintf</b> 的用法和 printf 完全一样，只是<b>第一个参数是 FILE*</b>，格式串往后移一位。所以 <code>fputc</code> 是单字符、<code>fprintf</code> 是格式化。</p>
<p><b>fscanf 的返回值</b>：返回<b>成功读到的项数</b>。读到文件末尾（EOF）时返回 <code>EOF</code>（值为 -1）。</p>
<p><b>循环终止判断</b>：<code>while (fscanf(f, "%d", &amp;n) == 1)</code>——每次读成功一项就进循环，读到 EOF 返回值不是 1 就退出。<b>不判返回值</b>就会死循环（EOF 时 n 不变，条件永远是同一个数）。</p>
<p><b>字符串读取的坑</b>：<code>fscanf(f, "%s", buf)</code> 遇到空格或换行就停，读不了整行。要读整行用 <code>fgets</code>。</p>
<p><b>fscanf 和 fscanf 混用</b>：格式化字符串必须和变量类型严格对应，写错就是内存错乱。</p>`,
  mem:`<pre class="cd mm">用 fscanf 读一个成绩表

  写:  FILE *w = fopen("score.txt", "w");
       fprintf(w, "%s %d\\n", "张三", 90);
       fprintf(w, "%s %d\\n", "李四", 85);
       fclose(w);

  文件内容:
       张三 90
       李四 85

  读:  FILE *r = fopen("score.txt", "r");
       char name[20]; int score;
       while (fscanf(r, "%s %d", name, &amp;score) == 2) {   ← 判返回值！
           printf("%s\\t%d\\n", name, score);
       }
       fclose(r);

  返回值含义:
    返回 2  → 成功读到两个字段（字符串 + 整数）
    返回 1  → 只读到 1 个（文件坏了或数据不完整）
    返回 EOF(-1) → 到文件末尾，没有数据了

  ❌ 不判返回值的死循环:
    while (1) {
        fscanf(r, "%d", &amp;n);   ← EOF 后 n 不变，条件永远成立
        printf("%d", n);       ← 疯狂重复打印最后一个数
    }</pre>
<div class="lg"><i style="background:#26a69a"></i>fscanf 的返回值是"读到几个"，EOF 返回 -1——不判它就死循环</div>`,
  wrong:[{t:'不判断 fscanf 返回值',code:`FILE *f = fopen("a.txt", "r");
int n;
while (1) {
    fscanf(f, "%d", &amp;n);     /* 没判返回值 */
    printf("%d ", n);
}`,err:'死循环，疯狂重复打印最后一个数',w:'读到 EOF 时 fscanf 返回 EOF，n 值不再变化 → 循环条件永远成立。正确：<code>while (fscanf(f,"%d",&amp;n) == 1)</code>。'}],
  tip:'<b>一句话记</b>：fprintf 格式串前多一个 FILE*；fscanf 判返回值 == 期望项数。',
  quiz:{q:'fscanf 从文件末尾读取时返回：',o:['0','1','EOF（-1）','随机值'],a:2,ex:'fscanf 成功读到几项返回几；到文件末尾无数据可读时返回 EOF（-1），据此退出循环。'}
},
{ t:'fgetc / fputc / fgets',
  key:'<b>fgetc 用 int 接返回值</b>（要装下 EOF）；<b>fgets 会把行尾 &#39;\\n&#39; 也读进来</b>，要注意去掉。',
  why:`<p><b>fgetc 用 int 接的原因</b>：EOF 是 -1，而 char 在很多平台是有符号 8 位，最大 -128，某些字符的无符号表示（如 0xFF）也会被当成 -1 → <b>永远读不到 EOF，死循环</b>。所以标准规定用 int 接。</p>
<p><b>fgets 的用法</b>：<code>fgets(buf, sizeof(buf), f)</code>，读<b>一行</b>（含空格）。它会把行尾的 &#39;\\n&#39; 也存进 buf，打印时可能出现多余的空行。</p>
<p><b>fgets 去掉行尾</b>：<code>buf[strcspn(buf, "&#39;\\n&#39;")] = &#39;\\0&#39;;</code>——找到第一个 &#39;\\n&#39; 的位置，改成 &#39;\\0&#39;。</p>
<p><b>getchar / putchar 是宏</b>：等价 <code>fgetc(stdin)</code> / <code>fputc(c, stdout)</code>，只操作标准输入输出。</p>
<p><b>fputs vs fputc</b>：fputc 一次一个字符，fputs 一次一个字符串（不带 &#39;\\n&#39;，要自己加）。</p>`,
  mem:`<pre class="cd mm">fgetc 为什么必须用 int 接

  假设 char 是有符号 8 位:
    文件里有个字节 0xFF
    存进 char  →  变成 -1（和 EOF 值一模一样！）
    while ((c = fgetc(f)) != EOF)  →  条件永远为假 → 读不出来

  正确:
    int c;
    while ((c = fgetc(f)) != EOF) {    ← int 能装下 0~255 和 -1
        putchar(c);
    }

  fgets 的"行尾 \\n"陷阱:
    char buf[100];
    fgets(buf, sizeof(buf), f);
    printf("&lt;%s&gt;\\n", buf);
    文件里是 "hello\\n"
    输出:  &lt;hello\n&gt;       ← 多了一个换行
    去掉:  buf[strcspn(buf, "&#39;\\n&#39;")] = &#39;\\0&#39;;
    输出:  &lt;hello&gt;        ✅</pre>
<div class="lg"><i style="background:#26a69a"></i>fgetc 用 int 接（要装下 EOF），fgets 记得切掉行尾 \\n</div>`,
  wrong:[{t:'用 char 接 fgetc 的返回值',code:`char c;
FILE *f = fopen("a.bin", "r");
while ((c = fgetc(f)) != EOF)      /* char 装不下某些字节 */
    putchar(c);`,err:'遇到 0xFF 之类的字节就提前退出（当 EOF 处理），输出不完整',w:'EOF 是 -1，而某些字节的无符号表示也可能是 -1。用 int 接才能区分"真字符"和"文件结束"。这是标准明确要求的。'}],
  tip:'<b>一句话记</b>：fgetc 用 int 接；fgets 会把 \\n 一起读进来，用 strcspn 切掉。',
  quiz:{q:'fgetc 的返回值应该用哪种类型接收？',o:['char','int','unsigned char','float'],a:1,ex:'EOF 是 -1，需要用 int 接收才能正确判断文件结束（char 可能无法区分 -1 与某些字符）。'}
},
{ t:'fwrite / fread 二进制读写',
  key:'<b>按内存块原样读写</b>，格式最灵活；<code>fwrite(buf, size, count, f)</code> 返回<b>实际成功写/读的块数</b>。',
  why:`<p><b>什么时候用二进制</b>：写图片、写结构体数组、写数据库。文本格式需要"格式化"，二进制就是<b>内存里什么样就写什么样</b>，最快最省空间。</p>
<p><b>三个参数</b>：<code>fwrite(buf, 每块大小, 块数, f)</code>。常用 <code>fwrite(&amp;s, sizeof(s), 1, f)</code> 写一个结构体。</p>
<p><b>返回值必须检查</b>：返回<b>成功读写的块数</b>，比预期少说明磁盘满了或者读写错误。不检查就可能悄悄写丢了。</p>
<p><b>对齐问题</b>：结构体有对齐填充，fread/fwrite 会原样带上。不同编译器/平台之间传结构体二进制可能不兼容。</p>
<p><b>文本 vs 二进制</b>：文本模式（"r"/"w"）跨平台会做换行符转换；二进制模式（"rb"/"wb"）不做转换，跨平台一致。</p>`,
  mem:`<pre class="cd mm">int 数组的二进制读写

  写:  int a[10] = {1,2,...,10};
       FILE *f = fopen("data.bin", "wb");
       size_t n = fwrite(a, sizeof(int), 10, f);   ← 一次写 10 个 int
       if (n != 10) fprintf(stderr, "写失败\\n");    ← 必须检查返回值
       fclose(f);

  读:  int b[10];
       FILE *r = fopen("data.bin", "rb");
       size_t m = fread(b, sizeof(int), 10, r);
       if (m != 10) fprintf(stderr, "读失败\\n");
       fclose(r);

  内存 vs 文件内容:
    a 在内存里:  [1][2][3]...[10]      共 40 字节
    文件里:      1 0 0 0 2 0 0 0 3 0 0 0 ...
                 ↑ 就是内存里那 40 字节的原样拷贝
    →  文本模式会写成 "1 2 3"（占更多字节，可人读）
    →  二进制模式写成原始字节（40 字节，程序读最快）

  模式对比:
    "wb"  二进制写，不做换行符转换，跨平台一致
    "w"   文本写，某些平台 \\n 会被转换（Windows 下变 \\r\\n）</pre>
<div class="lg"><i style="background:#26a69a"></i>fwrite 返回实际写的块数——和期望值比一比才知道写没写成功</div>`,
  wrong:[{t:'不检查 fwrite 的返回值',code:`FILE *f = fopen("big.bin", "wb");
int a[1000000];
fwrite(a, sizeof(int), 1000000, f);   /* 磁盘空间不足，只写了一部分 */
fclose(f);                             /* 但程序以为写成功了 */`,err:'无报错，但文件内容不完整（数据悄悄丢了一部分）',w:'<code>fwrite</code> 返回的是<b>实际成功写出的块数</b>。磁盘满、写错误时返回值小于 count，如果不检查，你就以为"写成功了"。'}],
  tip:'<b>一句话记</b>：fread/fwrite 三参数（缓冲区、块大小、块数）；返回值必须检查。',
  quiz:{q:'fwrite(buf, 4, 100, f) 返回 50 表示：',o:['写了 400 字节','只成功写了 50 个块','失败了','写了 50 字节'],a:1,ex:'返回值是成功读写的块数，每个块 4 字节，所以实际写了 50×4=200 字节。预期 100 块只写了 50 块，说明磁盘空间不足或写入出错。'}
},
{ t:'fseek / rewind / feof',
  key:'<code>fseek</code> 移动读写位置，<code>rewind</code> 回到开头，<code>feof</code> 判断是否到末尾——三者是<b>同一个"位置指针"</b>的三种操作。',
  why:`<p><b>文件位置指针</b>：每次 fopen 后，文件里都有一根"当前位置指针"，指向下一次读写的地方。读一个字节后它会往前走一格。fseek / rewind 就是在移动这根指针。</p>
<p><b>fseek(f, offset, origin)</b>：把指针移到"origin 起点 + offset 字节"的位置。origin 三个值：<code>SEEK_SET</code>（文件头）、<code>SEEK_CUR</code>（当前位置）、<code>SEEK_END</code>（文件尾）。</p>
<p><b>常见用法</b>：跳到最后读最后 8 个字节（取文件大小）、跳过文件头、随机访问第 n 条记录。文本模式下<b>只能</b> seek 到已经读过的边界，二进制模式下可以任意跳。</p>
<p><b>rewind(f)</b> = <code>fseek(f, 0, SEEK_SET)</code> 的简写，把指针拉回开头。读一遍想再读一遍时必须先 rewind。</p>
<p><b>feof 的正确用法</b>：feof 返回非 0 表示"上次读取已经到达末尾"。所以它<b>必须放在读操作之后</b>——先读，再看有没有读完。写成 <code>while (feof(f) == 0) { fread(...); }</code> 会多读一次、拿到脏数据。</p>
<p><b>feof vs feerror</b>：读取失败可能是"到末尾"也可能是"IO 错误"。feof 判断前者，feerror 判断后者。严谨的程序两个都要查。</p>`,
  mem:`<pre class="cd mm">fseek 的三种起点 origin

  ┌─────────────────────────────────────────┐
  │ 0      当前位置      文件末尾           │
  ├─────────────────────────────────────────┤
  │ SEEK_SET   SEEK_CUR    SEEK_END        │
  └─────────────────────────────────────────┘

  fseek(f, 10, SEEK_SET)   → 移到文件开头往后 10 字节
  fseek(f, 5,  SEEK_CUR)   → 从当前位置往后 5 字节
  fseek(f, 0,  SEEK_END)   → 移到文件末尾（常用来取文件大小）
  fseek(f, -8, SEEK_END)   → 从文件尾往前 8 字节

  经典用法：不读完整个文件就能取文件大小
    fseek(f, 0, SEEK_END);
    long size = ftell(f);      ← ftell 返回当前位置
    rewind(f);                 ← 回到开头

  feof 的正确写法 vs 错误写法:
    ✅ while (fread(p, 4, 1, f) == 1) { ... }     读不到就停
    ✅ while (fread(p, 4, 1, f) == 1);  if (feof(f)) ...
    ❌ while (feof(f) == 0) { fread(p, 4, 1, f); }  ← 多读一次，拿到脏数据</pre>
<div class="lg"><i style="background:#26a69a"></i>feof 是"上一次读取是否失败"，必须放在读操作之后判断</div>`,
  wrong:[{t:'用 feof 做循环条件',code:`FILE *f = fopen("a.txt", "r");
int x;
while (feof(f) == 0)      /* ❌ feof 必须放在读取之后 */
    fscanf(f, "%d", &x);
fclose(f);`,err:'最后一个数会被读两次，甚至读到脏数据',w:'feof 的判断依据是"上一次读取是否失败"。循环里先用 feof 判断、再读，会导致最后一条数据被重复处理。正确写法：<code>while (fscanf(f, "%d", &amp;x) == 1)</code>——用返回值判断。'}],
  tip:'<b>一句话记</b>：fseek 三个起点（头/当前/尾）；rewind = 回到开头；feof 一定要放在读取之后。',
  quiz:{q:'把文件位置指针移到文件末尾，应调用：',o:['fseek(f, 0, SEEK_CUR)','fseek(f, 0, SEEK_SET)','fseek(f, 0, SEEK_END)','rewind(f)'],a:2,ex:'SEEK_END 是"以文件末尾为起点"，偏移 0 就是文件末尾。常用于配合 ftell 获取文件大小。'}
}]
},
{ no:'10', ch:'预处理与多文件', color:'#5c6bc0', icon:'⚙', points:[
{ t:'#define 宏定义',
  key:'预处理期的<b>纯文本替换</b>，不占内存、没有类型；带参宏的每个参数和整体<b>都要加括号</b>。',
  why:`<p><b>宏的本质</b>：预处理器在编译之前做的<b>纯文本替换</b>，不占内存、没有类型、不做类型检查。</p>
<p><b>对象宏</b>：<code>#define PI 3.14159</code>，末尾<b>不要写分号</b>（分号会被当成宏内容的一部分，展开后变成 <code>3.14159; * r</code> 直接炸掉）。</p>
<p><b>带参宏的关键坑</b>：参数要加括号，整体也要加括号。<code>#define SQR(x) ((x)*(x))</code>。不加括号时 <code>SQR(1+2)</code> 展开成 <code>1+2*1+2 = 5</code> 而不是 <code>9</code>——运算符优先级会坑你。</p>
<p><b>宏没有类型检查</b>：<code>printf("%d\\n", SQR(2.5));</code> 能编译，但结果可能不是你想要的。参数里别用 <code>i++</code> 这种有副作用的表达式。</p>
<p><b>什么时候用 #define</b>：常量、调试开关、需要拼成标识符的地方。<b>什么时候用 const</b>：需要类型检查、要传参、要调试时。带参宏优先用 <code>static inline</code> 函数替代。</p>
<p><b>#undef</b> 可以取消定义。</p>`,
  mem:`<pre class="cd mm">带参宏的括号问题（经典陷阱）

  #define BAD(x)  x * x        ← 没加括号
  #define GOOD(x) ((x) * (x))  ← 每个参数和整体都加括号

  编译前预处理器做的事（纯文本替换）:

    BAD(3)      →  3 * 3                 = 9     ✅
    BAD(1+2)    →  1 + 2 * 1 + 2         = 5     ❌ 想要 9
    GOOD(1+2)   →  ((1+2) * (1+2))       = 9     ✅

  为什么 BAD(1+2) 得到 5?
    因为 * 优先级高于 +，所以先算 2*1 = 2，再加 1，再加 2 = 5

  用宏时还要注意:
    #define PI 3.14159          ← 末尾不能写分号！
    #define MAX(a,b) ((a)&gt;(b)?(a):(b))
    MAX(1+2, 4)  →  ((1+2)&gt;(4)?(1+2):(4)) = 4  ✅

  参数里别用有副作用的表达式:
    int i = 1;
    MAX(i++, i)   ← 展开后 i++ 出现两次，i 被加了两次</pre>
<div class="lg"><i style="background:#5c6bc0"></i>宏是文本替换，不是函数——优先级、副作用、类型检查全靠你自己</div>`,
  wrong:[{t:'带参宏不加括号',code:`#define SQR(x)  x * x
printf("%d\\n", SQR(1 + 2));    /* 期望 9 */`,err:'输出: 5        ← 不是 9',w:'宏展开成 <code>1 + 2 * 1 + 2</code>，乘法优先，得到 5。正确：<code>#define SQR(x) ((x)*(x))</code>——每个参数、整体都要括号。'}],
  tip:'<b>一句话记</b>：#define 是文本替换；对象宏末尾不带分号，带参宏处处加括号。',
  quiz:{q:'#define SQR(x) x*x，则 SQR(3) 的展开结果是：',o:['9','6','3','编译错误'],a:0,ex:'宏是纯文本替换：SQR(3) 展开为 3*3，计算得 9。若参数是 1+2 则展开为 1+2*1+2=5，需加括号避免。'}
},
{ t:'#include 头文件',
  key:'把另一个文件的<b>内容原样复制</b>进来；&lt;&gt; 找系统目录，"" 先找当前目录；头文件里要加<b>包含守卫</b>。',
  why:`<p><b>#include 的本质</b>：预处理器把被包含文件的内容<b>原样复制</b>到当前文件对应位置。所以重复包含 = 重复定义 = 报错。</p>
<p><b>&lt;&gt; vs ""</b>：<code>&lt;stdio.h&gt;</code> 找<b>系统/库目录</b>；<code>"myhead.h"</code> <b>先找当前目录</b>，找不到再去系统目录。</p>
<p><b>头文件里应该有什么</b>：函数<b>声明</b>、宏定义、结构体定义、typedef。<b>不应该有函数定义</b>（否则被多个 .c 包含后重复定义，链接时报错）。</p>
<p><b>包含守卫（include guard）</b>：每个头文件都要包一层 <code>#ifndef / #define / #endif</code>，防止同一个头文件被（直接或间接）重复包含。这是<b>强制规范</b>。</p>
<p><b>包含顺序</b>：先包含自己的 .h，再包含系统 .h，再包含其他项目的 .h。这样能保证头文件自己就能独立编译。</p>
<p><b>为什么 #include &lt;stdio.h&gt; 就有 printf</b>：printf 的<b>声明</b>就在 stdio.h 里。链接时再去 libc 里找实现。</p>`,
  mem:`<pre class="cd mm">#include 的两种写法对比

  #include &lt;stdio.h&gt;      →  直接去系统目录找
                              （如 /usr/include/stdio.h）

  #include "myhead.h"     →  先找当前目录
                              找不到再去系统目录

  头文件的"标准骨架":
    #ifndef MYHEAD_H       ← 如果 MYHEAD_H 还没被定义
    #define MYHEAD_H       ← 先定义它
    int add(int, int);     ← 函数声明
    #define N 100          ← 宏
    #endif                 ← 结束

  为什么这样写能防重复包含:
    第 1 次 #include "myhead.h"
      → MYHEAD_H 未定义 → 进入 → 定义 MYHEAD_H → 复制内容 ✅
    第 2 次 #include "myhead.h"
      → MYHEAD_H 已定义 → #ifndef 不成立 → 整个内容被跳过 ✅

  头文件里"应该" vs "不应该":
    应该 ✅  函数声明、宏、struct、typedef
    不应该 ❌ 函数定义（会被重复定义，链接时报 multiple definition）</pre>
<div class="lg"><i style="background:#5c6bc0"></i>#include 就是复制粘贴，所以必须加守卫防重复</div>`,
  wrong:[{t:'头文件没写包含守卫',code:`/* math.h */
int add(int, int);       /* 没有 #ifndef 守卫 */

/* a.c */
#include "math.h"
/* b.c */
#include "math.h"
/* main.c 同时 #include a.c 和 b.c 的 .h */`,err:"error: redefinition of 'add'  /  multiple definition of 'add'",w:'同一个头文件被包含两次，函数声明（或定义）就出现两次。解法：每个头文件都套上 <code>#ifndef / #define / #endif</code> 守卫。'}],
  tip:'<b>一句话记</b>：&lt;&gt; 找系统，"" 先找当前；每个头文件都要包含守卫。',
  quiz:{q:'#include &lt;file.h&gt; 与 #include "file.h" 的区别：',o:['完全一样','尖括号找系统目录，双引号先找当前目录','双引号更快','尖括号会编译文件'],a:1,ex:'&lt;&gt; 直接到系统/库目录查找；"" 先在当前目录找，找不到再去系统目录。系统头用 &lt;&gt;，自己的头文件用 ""。'}
},
{ t:'条件编译',
  key:'让部分代码<b>编译或不编译</b>：调试开关、跨平台适配、头文件防重复全靠它。',
  why:`<p><b>三种写法</b>：<code>#ifdef 名字</code>（定义过则编译）、<code>#ifndef 名字</code>（没定义过则编译）、<code>#if 表达式</code>（表达式非 0 则编译）。</p>
<p><b>#else / #elif / #endif</b> 配对使用。</p>
<p><b>调试开关</b>：把调试代码用 <code>#ifdef DEBUG ... #endif</code> 包起来，发布版不定义 DEBUG 就自动消失——比 <code>if (0)</code> 更彻底，因为<b>根本不参与编译</b>。</p>
<p><b>与 if (0) 的区别</b>：if (0) 的代码<b>仍然参与编译</b>（会做语法检查、可能报未使用变量警告）；条件编译直接不编译，连语法检查都跳过。适合放调试用的 printf。</p>
<p><b>跨平台</b>：可以用预定义宏区分平台（<code>_WIN32</code>、<code>__APPLE__</code>、<code>__linux__</code>）。这些是编译器自动定义的宏。</p>
<p><b>定义宏的方式</b>：源文件里写 <code>#define DEBUG</code>，或者命令行加 <code>-DDEBUG</code>。</p>`,
  mem:`<pre class="cd mm">调试开关：注释掉一行，调试代码就从可执行文件里彻底消失

  #include &lt;stdio.h&gt;
  #define DEBUG                    ← 开关：这一行决定下面代码要不要编译

  int main(void) {
      int x = 42;
  #ifdef DEBUG
      printf("[调试] x = %d\\n", x);   ← DEBUG 定义了就编译这一行
  #endif
      printf("x = %d\\n", x);
      return 0;
  }

  注释掉 #define DEBUG 后的效果:
    预处理后代码里连 printf 都不存在了
    →  不是"运行时不执行"，而是"编译时就不存在"
    →  可执行文件体积更小，也没有"未使用的变量"警告

  三种条件编译对比:
    #ifdef  NAME    →  NAME 被 #define 过就编译
    #ifndef NAME    →  NAME 没被 #define 过就编译（头文件守卫靠它）
    #if    表达式   →  表达式非 0 就编译

  命令行定义宏:
    clang -DDEBUG main.c -o main    ← 相当于在文件顶部加 #define DEBUG</pre>
<div class="lg"><i style="background:#5c6bc0"></i>条件编译是"编译期开关"，比 if(0) 更彻底——代码根本不参与编译</div>`,
  wrong:[{t:'用 if (0) 代替条件编译做调试开关',code:`#define DEBUG 0
if (DEBUG) {
    int debug_data = 42;       ← 变量仍然参与编译
    printf("%d\\n", debug_data);
}`,err:"warning: unused variable 'debug_data'",w:'<code>if (0)</code> 的代码<b>仍然参与编译</b>——语法要检查、变量会分配、可能报未使用警告。要彻底剔除，用 <code>#if DEBUG ... #endif</code>。'}],
  tip:'<b>一句话记</b>：#ifdef 定义了就编译；头文件守卫靠 #ifndef；发布版剔除调试代码用它。',
  quiz:{q:'#ifndef XX / #define XX / #endif 组合的作用：',o:['定义宏 XX','防止头文件被重复包含','条件报错','导入库'],a:1,ex:'这是"包含守卫"：第二次被包含时 XX 已定义，#ifndef 不成立，内容被跳过，避免重复定义错误。'}
},
{ t:'多文件与 extern',
  key:'大程序拆成多个 .c，各自编译最后链接；<code>extern</code> 是<b>声明"这变量在别处定义"</b>，不分配内存。',
  why:`<p><b>为什么拆文件</b>：一个大文件几百上千行很难维护；拆成模块，每个 .c 干一件事。C 工程的标准组织：<code>.h</code> 放声明，<code>.c</code> 放定义。</p>
<p><b>extern 的语义</b>：<code>extern int g;</code> 是<b>声明</b>——告诉编译器"g 这个变量存在，但定义在别的文件里"。它<b>不分配内存</b>。真正的<b>定义</b>只能有一个：<code>int g = 0;</code>。</p>
<p><b>为什么写 int g; 会重复定义</b>：全局作用域的 <code>int g;</code> 本身就是一个<b>定义</b>（隐式初始化为 0）。两个 .c 都这么写，链接时就有两个定义 → 报 <code>multiple definition</code>。</p>
<p><b>函数默认 extern</b>：函数声明默认是 extern 的，所以 <code>void add_one(void);</code> 就够了。</p>
<p><b>static 全局变量</b>：加了 static 的全局变量只属于<b>本文件</b>，别的 .c 里 extern 也找不到 → 用来做"文件私有"。</p>
<p><b>编译方式</b>：<code>clang main.c utils.c -o app</code>（一步），或者先 <code>clang -c a.c -o a.o</code> 再 <code>clang a.o b.o -o app</code>（两步，大项目常用）。</p>`,
  mem:`<pre class="cd mm">两个文件共享一个全局变量

  utils.c:
      int counter = 0;              ← 唯一的"定义"（分配内存）
      void add_one(void) { counter++; }

  main.c:
      extern int counter;           ← 只是"声明"，不分配内存
      void add_one(void);           ← 函数默认 extern，不写也行

      int main(void) {
          add_one(); add_one();
          printf("%d\\n", counter);  →  2
      }

  编译:
    clang main.c utils.c -o app     ← 一步编译 + 链接
    或者:
      clang -c main.c  -o main.o    ← 只编译，不链接
      clang -c utils.c -o utils.o
      clang main.o utils.o -o app   ← 只链接

  extern vs 定义的区别:
      extern int g;      ← 声明：告诉编译器"有这么个变量"，不占内存
      int g = 0;         ← 定义：真的分配内存（全局只能有一个）

  static 的作用:
      static int g;      ← 文件私有，别的 .c 里 extern g 找不到</pre>
<div class="lg"><i style="background:#5c6bc0"></i>extern 是"这里有个变量"的声明，不是"这里定义一个"——定义只能有一处</div>`,
  wrong:[{t:'两个 .c 里都写了 int g;',code:`/* a.c */  int g;         /* 这是定义 */
/* b.c */  int g;         /* 这也是定义 */
/* main.c */
#include "a.h"
#include "b.h"
int main(void) { g = 1; return 0; }`,err:"error: multiple definition of 'g'",w:'全局作用域的 <code>int g;</code> 本身就是一个定义（隐式初始化为 0）。两个文件都定义 → 链接时报重复定义。想跨文件共享：一个文件<b>定义</b>，其他文件用 <code>extern</code> <b>声明</b>。'}],
  tip:'<b>一句话记</b>：定义只能有一个，其他文件用 extern 声明；static 全局 = 文件私有。',
  quiz:{q:'在文件 B 中使用文件 A 定义的全局变量 g，B 中应写：',o:['int g;','extern int g;','static int g;','auto int g;'],a:1,ex:'extern int g; 是声明，告诉编译器 g 在别的文件里定义了，链接时合并。写 int g; 会重复定义。'}
}]
},
];

const FLAT=[],IDX=new Map();
DATA.forEach((c,ci)=>c.points.forEach((p,ti)=>{p.i=ti;IDX.set(ci+'-'+ti,FLAT.length);FLAT.push({p,ci,ti,c});}));
const TOTAL=FLAT.length,LS='cdeep_mastered_v1';
let mastered={},cur=0;
try{mastered=JSON.parse(localStorage.getItem(LS)||'{}');}catch(e){}
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(LS,JSON.stringify(mastered));
const kOf=f=>f.ci+'-'+f.ti;

function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  DATA.forEach((c,ci)=>{
    const done=c.points.filter((_,ti)=>mastered[ci+'-'+ti]).length;
    const g=document.createElement('div');g.className='ch open';
    g.innerHTML='<div class="chh"><span class="cdot" style="background:'+c.color+';color:'+c.color+'"></span><span class="ct">'+c.no+' · '+c.ch+'</span><span class="cc">'+done+'/'+c.points.length+'</span><span class="cr">▶</span></div><div class="pl"></div>';
    const list=g.querySelector('.pl');
    c.points.forEach((p,ti)=>{
      const d=document.createElement('div');
      d.className='pi'+(mastered[ci+'-'+ti]?' done':'');
      d.innerHTML='<span class="pn">'+c.no+'.'+(ti+1)+'</span><span class="pt">'+p.t+'</span><span class="pd"></span>';
      d.onclick=()=>goto(IDX.get(ci+'-'+ti));
      list.appendChild(d);
    });
    g.querySelector('.chh').onclick=()=>g.classList.toggle('open');
    nav.appendChild(g);
  });
  markCur();
}

function markCur(){
  document.querySelectorAll('.pi').forEach(el=>el.classList.remove('cur'));
  const i=IDX.get(kOf(FLAT[cur]));
  const els=document.querySelectorAll('.pi');
  if(els[i]){els[i].classList.add('cur');els[i].scrollIntoView({block:'nearest'});}
}

function updateProg(){
  const n=Object.keys(mastered).filter(k=>mastered[k]).length;
  $('#pf').style.width=(TOTAL?n/TOTAL*100:0)+'%';
  $('#pt').textContent='已掌握 '+n+' / '+TOTAL;
  $('#pv').textContent=TOTAL?Math.round(n/TOTAL*100)+'%':'';
}

function render(){
  const f=FLAT[cur],c=f.c,p=f.p,k=kOf(f);
  document.documentElement.style.setProperty('--acc',c.color);
  $('#cch').innerHTML='<span style="color:'+c.color+';font-weight:700">'+c.no+' · '+c.ch+'</span>';
  $('#cbi').textContent='知识点 '+(cur+1)+' / '+TOTAL;
  const st=$('#star');
  st.className='star'+(mastered[k]?' on':'');
  st.textContent=mastered[k]?'✓ 已掌握':'☆ 标记已掌握';
  st.onclick=()=>{mastered[k]=!mastered[k];save();buildNav();updateProg();render();};

  let h='<div class="kh"><span class="ktag" style="color:'+c.color+';border-color:'+c.color+'55;background:'+c.color+'14">'+c.icon+'  第 '+c.no+' 章 · '+c.ch+'</span>'+
        '<h1 class="kt">'+p.t+'</h1><div class="kk">'+p.key+'</div></div>';
  h+='<div class="sec"><div class="sh">原理拆解</div><div class="bd">'+p.why+'</div></div>';
  if(p.mem)h+='<div class="sec"><div class="sh">内存与地址</div>'+p.mem+'</div>';
  if(p.wrong&&p.wrong.length){
    h+='<div class="sec"><div class="sh">常见错例</div>';
    p.wrong.forEach(w=>{h+='<div class="wr"><div class="wh">✗ '+w.t+'</div><pre class="cd">'+w.code+'</pre><div class="er">'+w.err+'</div><div class="ww">'+w.w+'</div></div>';});
    h+='</div>';
  }
  if(p.tip)h+='<div class="sec"><div class="ti">💡 '+p.tip+'</div></div>';
  if(p.quiz){
    h+='<div class="sec"><div class="sh">随堂自测</div><div class="qz" id="qz"><div class="qq">'+p.quiz.q+'</div>';
    p.quiz.o.forEach((o,i)=>{h+='<div class="qo" data-i="'+i+'"><span class="mk">'+['A','B','C','D'][i]+'</span><span>'+o+'</span></div>';});
    h+='<div class="qe">'+p.quiz.ex+'</div></div></div>';
  }
  $('#view').innerHTML=h;
  $('#pv').disabled=cur===0;
  $('#nx').disabled=cur===TOTAL-1;
  $('#pm').textContent=(cur+1)+' / '+TOTAL;
  document.querySelectorAll('.qo').forEach(el=>{
    el.onclick=()=>{
      const a=p.quiz.a;
      document.querySelectorAll('.qo').forEach(e=>e.classList.remove('ok','no'));
      el.classList.add(+el.dataset.i===a?'ok':'no');
      document.querySelectorAll('.qo')[a].classList.add('ok');
      $('#qz').classList.add('ex');
    };
  });
  markCur();
  $('#main').scrollTop=0;
  if(location.hash!=='#'+cur)history.replaceState(null,'','#'+cur);
}

function goto(i){cur=Math.max(0,Math.min(TOTAL-1,i));render();}

$('#pv').onclick=()=>goto(cur-1);
$('#nx').onclick=()=>goto(cur+1);
$('#burger').onclick=()=>$('#side').classList.toggle('show');
$('#q').oninput=function(){
  const v=this.value.trim();
  document.querySelectorAll('.pi').forEach(el=>{
    const t=el.querySelector('.pt').textContent;
    el.style.display=(!v||t.includes(v))?'':'none';
  });
  if(v)document.querySelectorAll('.ch').forEach(c=>c.classList.add('open'));
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')goto(cur-1);
  if(e.key==='ArrowRight')goto(cur+1);
});
window.addEventListener('hashchange',()=>{
  const m=location.hash.match(/(\d+)/);
  if(m)goto(+m[1]);
});
buildNav();updateProg();
goto(location.hash.match(/(\d+)/)?+location.hash.match(/(\d+)/)[1]:0);
</script>
</body>
</html>
